<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain Quest">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#5b3df5">
<title>Naomi's Brain Quest</title>
<style>
/* Naomi's Brain Quest */
:root{
  --bg1:#5b3df5; --bg2:#00b4d8; --ink:#1e1b4b; --card:#ffffff; --muted:#6b7280;
  --pink:#ff4f8b; --orange:#ff9f1c; --teal:#2ec4b6; --blue:#3a86ff; --purple:#9b5de5; --gold:#ffc300; --green:#22c55e;
  --r:22px; --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-weight:700;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-50%;background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2px);background-size:34px 34px;
  animation:drift 40s linear infinite;pointer-events:none;z-index:0}
@keyframes drift{to{transform:translate(34px,34px)}}
button{font-family:inherit;font-weight:800;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit;font-size:18px;font-weight:700;padding:10px 12px;border-radius:12px;border:3px solid #c7d2fe;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
#app{position:relative;z-index:1;height:100%;height:100dvh}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex;animation:screenIn .28s ease-out}
@keyframes screenIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* chunky buttons */
.btn{background:var(--gold);color:#3b2600;border-radius:18px;padding:14px 22px;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .06s, box-shadow .06s;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.pink{background:var(--pink);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}
.btn.purple{background:var(--purple);color:#fff}.btn.white{background:#fff;color:var(--ink)}.btn.gray{background:#e5e7eb;color:#374151}
.btn.small{font-size:17px;padding:8px 14px;min-height:44px;border-radius:14px}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 8px 0 rgba(30,27,75,.18),0 12px 30px rgba(0,0,0,.15);padding:18px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-size:clamp(26px,3.6vw,40px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);letter-spacing:.5px;flex:1;min-width:220px;line-height:1.05}
.logo small{display:block;font-size:.45em;opacity:.85;letter-spacing:1px}
.pill{background:rgba(255,255,255,.95);border-radius:999px;padding:8px 16px;font-size:22px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:48px}
.pill.egg{background:linear-gradient(135deg,#ffd6e8,#fff3b0);animation:wiggle 1.6s ease-in-out infinite}
.iconbtn{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.95);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.back{background:rgba(255,255,255,.95);border-radius:16px;font-size:20px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:52px}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(0)}}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:18px;flex:1;min-height:0}
.avatar-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.avatar-card .avatar-box{width:100%;max-width:280px;aspect-ratio:250/262;background:radial-gradient(circle at 50% 40%,#fff7d6,#ffd6f0 60%,#e0d4ff);border-radius:20px;padding:8px}
.avatar-card h2{margin:0;font-size:30px}
.avatar-svg{width:100%;height:100%;display:block;overflow:visible}
.avatar-svg.has-mythic{filter:drop-shadow(0 0 8px rgba(255,60,172,.6));animation:mythGlow 2.4s linear infinite}
@keyframes mythGlow{0%{filter:drop-shadow(0 0 8px #ff3cac)}33%{filter:drop-shadow(0 0 8px #00e5ff)}66%{filter:drop-shadow(0 0 8px #ffe600)}100%{filter:drop-shadow(0 0 8px #ff3cac)}}
.pet-bob{animation:bob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
@keyframes flick{to{transform:scaleY(.75)}}
.glowy{filter:drop-shadow(0 0 4px #fde047)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tile{position:relative;border-radius:24px;padding:20px;color:#fff;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 0 rgba(0,0,0,.22);overflow:hidden;font-size:16px}
.tile .t-icon{position:absolute;right:14px;top:8px;font-size:64px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.tile h3{margin:0;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.tile p{margin:4px 0 0;opacity:.95}
.tile.live{background:linear-gradient(135deg,#ff4f8b,#ff9f1c);grid-column:span 2;min-height:190px;animation:pulseTile 2.2s ease-in-out infinite}
.tile.live h3{font-size:40px}
.tile.live .t-icon{font-size:96px}
.tile.live .play-badge{position:absolute;left:20px;top:18px;background:#fff;color:#ff4f8b;border-radius:999px;padding:6px 14px;font-size:18px}
@keyframes pulseTile{50%{transform:scale(1.015)}}
.tile.locked{background:linear-gradient(135deg,#8b8fb1,#6b6f94);cursor:default}
.tile.locked::after{content:"🔒 Coming soon";position:absolute;top:14px;left:16px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px 12px;font-size:15px}
.pbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.pb{background:rgba(255,255,255,.95);border-radius:18px;padding:12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.pb b{display:block;font-size:26px;color:var(--purple)}
.pb span{font-size:14px;color:var(--muted)}
.right-col{display:flex;flex-direction:column;min-height:0}

/* math menu */
.section-title{color:#fff;font-size:24px;margin:4px 0 8px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.ops{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.op-card{border-radius:20px;padding:14px 8px;color:#fff;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;gap:4px;border:5px solid transparent;min-height:120px;justify-content:center}
.op-card .sym{font-size:46px;line-height:1}
.op-card .st{font-size:14px;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px}
.op-card.sel{border-color:#fff;transform:translateY(-4px) scale(1.04);box-shadow:0 10px 0 rgba(0,0,0,.25),0 0 0 4px rgba(255,255,255,.4)}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-top:8px}
.diff-btn{border-radius:18px;padding:14px;font-size:24px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.22);border:5px solid transparent;min-height:70px}
.diff-btn small{display:block;font-size:13px;opacity:.95;font-weight:700}
.diff-btn.sel{border-color:#fff;transform:translateY(-3px)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{background:#fff;border-radius:22px;padding:16px 18px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid transparent;display:flex;gap:14px;align-items:center;min-height:100px}
.mode-card .mi{font-size:50px}
.mode-card h4{margin:0;font-size:26px}
.mode-card p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.mode-card .rec{margin-top:6px;font-size:16px;color:var(--purple)}
.mode-card.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,195,0,.5)}
.play-bar{display:flex;justify-content:center;margin-top:18px;padding-bottom:8px}
.play-big{font-size:38px;padding:18px 60px;border-radius:26px;background:linear-gradient(180deg,#5cff8f,#16b84e);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 8px 0 #0b7a31;animation:pulseTile 1.4s ease-in-out infinite}
.play-big:active{transform:translateY(5px);box-shadow:0 3px 0 #0b7a31}

/* play screen */
#s-play{padding:12px 14px}
.play-wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;flex:1;min-height:0}
.panel{background:rgba(255,255,255,.96);border-radius:28px;box-shadow:0 8px 0 rgba(30,27,75,.2);padding:16px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.p-left{justify-content:space-between;transition:box-shadow .2s, background .3s}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:22px}
.hud .hearts{font-size:30px;letter-spacing:2px}
.hud .combo{background:linear-gradient(135deg,#ff9f1c,#ff4f8b);color:#fff;border-radius:999px;padding:6px 16px;font-size:24px;min-width:90px;text-align:center;transition:transform .15s}
.hud .combo.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.35)}}
.hud .timer{font-size:36px;font-variant-numeric:tabular-nums;background:#1e1b4b;color:#fff;border-radius:16px;padding:4px 14px;min-width:120px;text-align:center}
.problem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.problem .eq{font-size:clamp(64px,10.5vw,150px);line-height:1;color:var(--ink);white-space:nowrap;letter-spacing:2px;text-shadow:0 6px 0 rgba(91,61,245,.15)}
.problem .eq.long{font-size:clamp(52px,8vw,118px)}
.answer-box{margin-top:18px;min-width:3.2em;font-size:clamp(56px,8vw,110px);line-height:1.1;border-radius:24px;border:6px dashed #c4b5fd;padding:4px 24px;color:var(--purple);min-height:1.3em;background:#faf5ff;font-variant-numeric:tabular-nums}
.answer-box.good{border-style:solid;border-color:var(--green);color:var(--green);background:#ecfdf5;animation:pop .3s}
.answer-box.bad{border-style:solid;border-color:#60a5fa;color:#2563eb;background:#eff6ff}
.review-tag{font-size:16px;color:#7c3aed;background:#ede9fe;border-radius:999px;padding:4px 12px;margin-bottom:10px;visibility:hidden}
.review-tag.on{visibility:visible}
.review-tag.fix{background:#dbeafe;color:#1d4ed8;font-weight:800}
.answer-box.fix{border-color:#60a5fa;background:#eff6ff}
.diff-btn{position:relative}
.diff-btn .sug{position:absolute;top:-12px;right:-6px;background:#fff;color:#7c3aed;font-size:13px;border-radius:999px;padding:3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);transform:rotate(6deg)}
.mastery-line{color:var(--muted);font-size:16px;margin-top:4px}
.mbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#e2e8f0;margin:0 auto 4px;max-width:120px}
.mbar i{display:block;height:100%}
.grid-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fgrid{border-collapse:separate!important;border-spacing:2px;font-size:11px!important;width:auto!important}
.fgrid th{padding:2px 4px!important;color:#64748b;font-size:11px;border:0!important;background:none!important}
.fgrid td{width:20px;height:20px;min-width:20px;padding:0!important;text-align:center;border-radius:4px;border:0!important;color:#334155;font-weight:800}
.fgrid td.none{background:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#64748b;margin-top:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.trend{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.tcol{flex:1;min-width:46px;text-align:center;font-size:12px;color:#64748b;display:flex;flex-direction:column;align-items:center}
.tbar-wrap{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.tbar{width:70%;border-radius:6px 6px 2px 2px;min-height:2px;background:#e2e8f0}
.tcol b{color:#0f172a;font-size:13px;margin-top:4px;min-height:16px}
.tcol span{min-height:14px}
.tcol small{font-size:10px;line-height:1.1;margin-top:3px}
@keyframes pop{50%{transform:scale(1.12)}}
.gentle{min-height:60px;font-size:28px;color:#2563eb;text-align:center}
.p-right{gap:12px}
.progress-wrap{background:#1e1b4b;border-radius:22px;padding:12px 14px 14px;color:#fff;position:relative}
.progress-label{display:flex;justify-content:space-between;font-size:18px;margin-bottom:10px}
.progress-label b{color:var(--gold)}
.bar{position:relative;height:40px;border-radius:999px;background:#312e81;box-shadow:inset 0 4px 0 rgba(0,0,0,.3)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#00f5d4,#00bbf9,#9b5de5,#f15bb5,#fee440);background-size:200% 100%;animation:flow 2s linear infinite;transition:width .35s cubic-bezier(.3,1.6,.5,1);min-width:40px;box-shadow:0 0 0 rgba(255,255,255,0)}
.bar-fill::after{content:"";position:absolute;inset:4px 10px auto 10px;height:9px;border-radius:999px;background:rgba(255,255,255,.45)}
@keyframes flow{to{background-position:-200% 0}}
.bar-icons{position:absolute;inset:0}
.bar-icon{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;filter:grayscale(.2) drop-shadow(0 2px 0 rgba(0,0,0,.4));transition:transform .2s}
.bar-icon.got{filter:none;opacity:.55;transform:translate(-50%,-50%) scale(.8)}
.bar-icon.next{animation:nextIcon .8s ease-in-out infinite;font-size:36px}
@keyframes nextIcon{50%{transform:translate(-50%,-62%) scale(1.25)}}
.tiers{display:flex;gap:8px;margin-top:10px;justify-content:space-between}
.tier{flex:1;text-align:center;background:#312e81;border-radius:12px;padding:4px 2px;font-size:16px;transition:opacity .3s}
.tier.gone{opacity:.25;text-decoration:line-through}
.tier.live{background:#4c1d95;box-shadow:0 0 0 2px var(--gold)}
.hype-1 .bar-fill{box-shadow:0 0 14px rgba(255,255,255,.6)}
.hype-2 .bar-fill{box-shadow:0 0 22px #fee440;animation-duration:1s}
.hype-2 .progress-wrap{animation:glowPulse 1s ease-in-out infinite}
.hype-3 .bar-fill{box-shadow:0 0 30px #ff4f8b,0 0 50px #fee440;animation-duration:.5s}
.hype-3 .progress-wrap{animation:glowPulse .5s ease-in-out infinite, shake .4s linear infinite}
.hype-3 .p-left{background:#fff7ed;box-shadow:0 8px 0 rgba(30,27,75,.2),0 0 0 6px #ff9f1c,0 0 40px #ff4f8b}
.hype-2 .p-left{box-shadow:0 8px 0 rgba(30,27,75,.2),0 0 0 5px #fee440}
@keyframes glowPulse{50%{box-shadow:0 0 0 4px #fee440,0 0 34px #fee440}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.close-call{font-size:20px;text-align:center;color:var(--gold);min-height:26px;margin-top:8px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;min-height:0}
.key{background:linear-gradient(180deg,#fff,#eef2ff);border-radius:22px;font-size:clamp(34px,4.6vw,56px);box-shadow:0 7px 0 #a5b4fc;border:3px solid #c7d2fe;min-height:64px;color:var(--ink)}
.key:active,.key.down{transform:translateY(5px);box-shadow:0 2px 0 #a5b4fc}
.key.del{background:linear-gradient(180deg,#ffe4e6,#fecdd3);box-shadow:0 7px 0 #fda4af;border-color:#fecdd3;font-size:clamp(28px,3.6vw,44px)}
.key.go{background:linear-gradient(180deg,#5cff8f,#16b84e);box-shadow:0 7px 0 #0b7a31;border-color:#86efac;color:#fff}
.play-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.play-top .mod{color:#fff;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.25)}

/* splash */
#splash{position:fixed;inset:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center}
@media (orientation:landscape){#splash{align-items:flex-start;padding-top:9vh}#splash .splash-txt{font-size:clamp(48px,7vw,96px)}#splash .splash-txt.l3,#splash .splash-txt.reward{font-size:clamp(58px,8.5vw,118px)}#splash .splash-txt.soft{font-size:clamp(34px,4.6vw,60px)}}
.splash-txt{position:relative;font-size:clamp(56px,9vw,120px);color:#fff;-webkit-text-stroke:3px rgba(30,27,75,.55);text-shadow:0 8px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.7);animation:splash 1s ease-out forwards;white-space:nowrap;letter-spacing:2px}
.splash-txt.l1{color:#fee440}.splash-txt.l2{color:#ff9f1c;font-size:clamp(66px,11vw,140px)}.splash-txt.l3{color:#ff4f8b;font-size:clamp(76px,12.5vw,160px)}
.splash-txt.reward{color:#00f5d4;font-size:clamp(70px,12vw,150px);animation:splashBig 1.6s ease-out forwards}
.splash-txt.soft{color:#bfdbfe;font-size:clamp(40px,6vw,72px)}
@keyframes splash{0%{transform:scale(.2) rotate(var(--rot,0deg));opacity:0}20%{transform:scale(1.15) rotate(var(--rot,0deg));opacity:1}70%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}100%{transform:scale(1.1) translateY(-60px) rotate(var(--rot,0deg));opacity:0}}
@keyframes splashBig{0%{transform:scale(.1);opacity:0}15%{transform:scale(1.3) rotate(-4deg);opacity:1}30%{transform:scale(1) rotate(3deg)}80%{transform:scale(1.05);opacity:1}100%{transform:scale(1.4);opacity:0}}
body.shake-screen #app{animation:shake .3s linear 2}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

/* countdown */
.countdown{position:fixed;inset:0;z-index:70;background:rgba(30,27,75,.55);display:flex;align-items:center;justify-content:center;font-size:200px;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.3)}
.countdown span{animation:cd .9s ease-out forwards}
@keyframes cd{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}

/* results */
.results{max-width:820px;margin:auto;width:100%;text-align:center}
.results h1{font-size:48px;margin:0 0 6px;color:var(--purple)}
.stars{display:flex;justify-content:center;gap:14px;font-size:90px;margin:8px 0}
.stars .s{filter:grayscale(1) opacity(.3);transform:scale(.6)}
.stars .s.on{filter:none;animation:starIn .5s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.pb-banner{display:inline-block;background:linear-gradient(90deg,#ff4f8b,#ffc300);color:#fff;font-size:28px;border-radius:999px;padding:8px 24px;margin:6px 0 10px;animation:pulseTile .9s infinite;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.res-stats div{background:#f5f3ff;border-radius:16px;padding:10px}
.res-stats b{display:block;font-size:30px;color:var(--ink)}
.res-stats span{font-size:14px;color:var(--muted)}
.rewards-list{text-align:left;background:#fffbeb;border-radius:18px;padding:12px 18px;margin:10px 0;font-size:19px}
.rewards-list div{padding:4px 0}

/* eggs */
.overlay{position:fixed;inset:0;z-index:80;background:radial-gradient(circle,#4c1d95,#1e1b4b);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay.r-mythic{background:#2b1055;overflow:hidden}
.overlay.r-mythic::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,#ff3cac,#784ba0,#2b86c5,#00f5d4,#fee440,#ff3cac);animation:spin 6s linear infinite;z-index:0}
.overlay>*{position:relative;z-index:1}
.overlay.r-legendary{background:radial-gradient(circle,#fbbf24,#b45309 70%,#451a03)}
.overlay.r-epic{background:radial-gradient(circle,#c084fc,#581c87 75%)}
.overlay.r-rare{background:radial-gradient(circle,#60a5fa,#1e3a8a 75%)}
.egg-title{font-size:40px;text-shadow:0 4px 0 rgba(0,0,0,.3);margin-bottom:10px}
.egg-stage{position:relative;width:min(340px,70vw);height:min(400px,48vh);display:flex;align-items:center;justify-content:center}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 10s linear infinite;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.egg{position:relative;width:62%;height:80%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset -18px -18px 0 rgba(0,0,0,.12),0 18px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .1s}
.egg .spot{position:absolute;border-radius:50%;background:rgba(255,255,255,.65)}
.egg.shake{animation:eggShake .45s}
.egg.crack1::after,.egg.crack2::after{content:"";position:absolute;left:10%;right:10%;top:42%;height:16px;background:linear-gradient(135deg,transparent 45%,#1e1b4b 45%,#1e1b4b 55%,transparent 55%) 0 0/24px 16px repeat-x}
.egg.crack2::after{top:38%;height:22px;background-size:20px 22px}
.egg.burst{animation:burst .5s forwards}
@keyframes eggShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes burst{to{transform:scale(1.8);opacity:0}}
.item-reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:itemIn .7s cubic-bezier(.3,1.7,.5,1)}
.item-reveal .avatar-svg{width:85%;height:85%}
@keyframes itemIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.rarity-tag{font-size:56px;text-shadow:0 5px 0 rgba(0,0,0,.35);animation:pop .6s;letter-spacing:3px}
.rarity-tag.mythic{background:linear-gradient(90deg,#ff3cac,#fee440,#00f5d4,#ff3cac);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 1.2s linear infinite;font-size:72px;-webkit-text-stroke:2px #fff}
.item-name{font-size:32px;margin:4px 0}
.dup{font-size:20px;opacity:.9}
.hint{font-size:24px;opacity:.9;margin-top:12px;animation:pulseTile 1.2s infinite}

/* closet */
.closet{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:16px;flex:1;min-height:0}
.closet .avatar-box{background:radial-gradient(circle at 50% 40%,#fff7d6,#ffd6f0 60%,#e0d4ff);border-radius:22px;aspect-ratio:250/262;max-width:360px;width:100%;margin:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#ede9fe;border-radius:14px;padding:10px 14px;font-size:18px;min-height:48px}
.tab.sel{background:var(--purple);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;overflow:auto;padding:4px}
.item{background:#fff;border-radius:18px;border:5px solid #e5e7eb;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:14px;min-height:150px;position:relative}
.item .prev{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.item .prev .avatar-svg{width:100%;height:100%}
.item.unowned{background:#f3f4f6;color:#9ca3af}
.item.unowned .prev{font-size:54px}
.item.eq{box-shadow:0 0 0 4px var(--gold)}
.item.eq::after{content:"✔";position:absolute;top:4px;right:8px;color:var(--green);font-size:22px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}
.sw{width:58px;height:58px;border-radius:50%;border:5px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sw.sel{box-shadow:0 0 0 4px var(--purple)}

/* kawaii avatar polish */
.avatar-card .avatar-box,.closet .avatar-box{background:radial-gradient(circle at 18% 22%,#fff 0 1.4%,transparent 1.8%),radial-gradient(circle at 82% 16%,#fff 0 1%,transparent 1.4%),radial-gradient(circle at 86% 70%,#fff 0 1.3%,transparent 1.7%),radial-gradient(circle at 12% 78%,#fff 0 .9%,transparent 1.3%),radial-gradient(circle at 50% 42%,#fff8e8,#ffe0f0 55%,#e6dcff);border:4px solid #fff;box-shadow:0 0 0 3px #ffd1e8,inset 0 -10px 24px rgba(201,182,255,.35)}
.avatar-svg.crop{overflow:hidden}
.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.55)}}
.item .prev{background:radial-gradient(circle at 50% 45%,#fff7fb,#fde8f3 70%,#efe8ff);border-radius:14px;overflow:hidden}
.item.unowned .prev{background:#eceaf2}
.hs{width:92px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fff7fb,#ffe3f0);border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink)}
.hs .avatar-svg{width:80px;height:80px;flex:none}
.hs span{display:block;line-height:1.2;margin-top:2px}
.hs.sel{box-shadow:0 0 0 4px var(--purple)}
.egg{border:5px solid rgba(255,255,255,.75);box-shadow:inset -16px -16px 0 rgba(150,90,170,.13),0 14px 0 rgba(60,20,90,.22)}
.egg .e-eye{position:absolute;top:47%;width:10%;height:12%;background:#3b2a4a;border-radius:50%}
.egg .e-eye::after{content:"";position:absolute;left:18%;top:16%;width:42%;height:38%;background:#fff;border-radius:50%}
.egg .e-eye.l{left:30%}.egg .e-eye.r{right:30%}
.egg .e-blush{position:absolute;top:60%;width:13%;height:6%;background:#ff8fab;opacity:.55;border-radius:50%}
.egg .e-blush.l{left:18%}.egg .e-blush.r{right:18%}
.egg .e-mouth{position:absolute;top:58%;left:50%;width:9%;height:4.5%;border:3px solid #7a3b4f;border-top:none;border-radius:0 0 30px 30px;transform:translateX(-50%)}
.egg .e-spark{position:absolute;color:#fff;font-size:26px;text-shadow:0 0 6px rgba(255,255,255,.9);animation:twinkleTxt 1.6s ease-in-out infinite}
/* the topbar "Hatch!" pill also has class .egg; keep it a pill, not an egg shape */
.pill.egg{width:auto;height:auto;border:0;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;color:var(--ink)}
.egg .e-spark.s1{left:-8%;top:10%}.egg .e-spark.s2{right:-6%;top:34%;animation-delay:.7s}
@keyframes twinkleTxt{50%{opacity:.3;transform:scale(.6)}}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.reward-card{text-align:center}
.reward-card .ri{font-size:70px}
.reward-card h3{margin:4px 0;font-size:26px}
.reward-card .cost{font-size:22px;color:#b45309;margin-bottom:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,10,50,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:14px 0}
.pin-dots i{width:24px;height:24px;border-radius:50%;border:4px solid var(--purple)}
.pin-dots i.on{background:var(--purple)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad .key{min-height:66px;font-size:32px}
.pin-err{color:#dc2626;min-height:24px}

/* parent */
#s-parent{background:#f1f5f9;color:#0f172a}
#s-parent .topbar .logo{color:#1e1b4b;text-shadow:none}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.p-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:600}
.p-card h3{margin:0 0 10px;font-size:20px}
.p-card table{width:100%;border-collapse:collapse;font-size:15px}
.p-card th,.p-card td{text-align:left;padding:6px 4px;border-bottom:1px solid #e2e8f0}
.p-card th{color:#64748b;font-size:13px}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.p-stats div{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}
.p-stats b{display:block;font-size:24px}
.p-stats span{font-size:12px;color:#64748b}
.p-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.p-row label{font-size:14px;color:#475569}
.p-row input[type=number]{width:96px}
.p-row input[type=text]{width:150px}
.p-note{font-size:13px;color:#64748b;font-weight:500}
.wide{grid-column:1/-1}
.scroll-x{overflow-x:auto}
.mod-table td{text-align:center}
.mod-table td:first-child{text-align:left}

/* answer-method picker (math menu) */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.method-btn{background:#fff;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid transparent;min-height:62px;color:var(--ink)}
.method-btn .mi{font-size:36px;line-height:1;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.method-btn.m-pad .mi{background:#e0e7ff}.method-btn.m-bubble .mi{background:#cffafe}.method-btn.m-write .mi{background:#fce7f3}
.method-btn b{display:block;font-size:20px}
.method-btn small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.method-btn.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,195,0,.5)}

/* Bubble Pop */
.bubble-field{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;--bs:130px;
  background:radial-gradient(circle at 20% 110%,#fbcfe8 0,transparent 45%),radial-gradient(circle at 85% 100%,#bae6fd 0,transparent 50%),linear-gradient(180deg,#f5f3ff,#ecfeff);
  box-shadow:inset 0 0 0 3px #e9d5ff}
.bubble{position:absolute;top:100%;left:50%;width:var(--bs);height:var(--bs);margin-left:calc(var(--bs) / -2);padding:0;border-radius:50%;background:none;box-shadow:none;
  animation:bubRise 7s linear infinite;touch-action:manipulation;z-index:1}
.bub-in{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.95);animation:bubSway 3.2s ease-in-out infinite;
  box-shadow:inset -10px -14px 22px rgba(255,255,255,.65),inset 8px 10px 18px rgba(255,255,255,.5),0 8px 18px rgba(91,61,245,.18)}
.bub-in::before{content:"";position:absolute;width:26%;height:16%;left:20%;top:16%;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-30deg)}
.bub-in::after{content:"";position:absolute;width:8%;height:8%;left:52%;top:18%;border-radius:50%;background:rgba(255,255,255,.9)}
.bubble.c0 .bub-in{background:radial-gradient(circle at 35% 30%,#fff 0,#fdf2f8 25%,#f9a8d4 100%)}
.bubble.c1 .bub-in{background:radial-gradient(circle at 35% 30%,#fff 0,#f5f3ff 25%,#c4b5fd 100%)}
.bubble.c2 .bub-in{background:radial-gradient(circle at 35% 30%,#fff 0,#ecfeff 25%,#67e8f9 100%)}
.bubble.c3 .bub-in{background:radial-gradient(circle at 35% 30%,#fff 0,#fefce8 25%,#fcd34d 100%)}
.bub-num{position:relative;font-size:calc(var(--bs) * .4);color:#4c1d95;text-shadow:0 3px 0 rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
.bub-num.small{font-size:calc(var(--bs) * .32)}
.bubble-field.frozen .bubble,.bubble-field.frozen .bub-in{animation-play-state:paused}
.bubble.popped{z-index:2}
.bubble.popped .bub-in{animation:bubPop .32s ease-out forwards!important}
.bubble.wrong-pop .bub-in{animation:bubPop .32s ease-out forwards!important}
.bubble.reveal .bub-in{box-shadow:0 0 0 6px #86efac,0 0 26px 8px rgba(34,197,94,.45);animation:bubSway 3.2s ease-in-out infinite,pop .5s 2}
@keyframes bubRise{from{top:100%}to{top:calc(var(--bs) * -1.05)}}
@keyframes bubSway{0%,100%{transform:translateX(-9px) rotate(-3deg)}50%{transform:translateX(9px) rotate(3deg)}}
@keyframes bubPop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.28);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.sparkles{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.sparkles i{position:absolute;left:-14px;top:-14px;font-style:normal;font-size:28px;animation:spark .8s ease-out forwards}
@keyframes spark{0%{transform:rotate(var(--a)) translateY(0) scale(.4);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(1.1);opacity:0}}

/* Write It */
.ink-wrap{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;border:4px dashed #f0abfc;
  background:linear-gradient(transparent calc(50% - 1px),#fbcfe8 calc(50% - 1px),#fbcfe8 calc(50% + 1px),transparent calc(50% + 1px)),
             linear-gradient(transparent 84%,#c4b5fd 84%,#c4b5fd calc(84% + 3px),transparent calc(84% + 3px)),#fffafd}
#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.ink-hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:clamp(22px,2.6vw,30px);color:#d8b4fe;pointer-events:none;transition:opacity .2s}
.ink-hint.gone{opacity:0}
.ink-read{position:absolute;left:50%;top:12px;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;white-space:nowrap;
  background:#4c1d95;color:#fff;border-radius:999px;padding:6px 18px;font-size:clamp(20px,2.4vw,28px);transition:opacity .15s,transform .15s;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ink-read.on{opacity:1;transform:translateX(-50%) scale(1)}
.ink-read.good{background:#7c3aed}
.ink-read.unsure{background:#0ea5e9;white-space:normal;max-width:92%;text-align:center}
.ink-btns{display:flex;gap:12px}
.ink-btns .btn{flex:1;font-size:24px;min-height:62px;border-radius:20px}
.ink-btns .btn.white{box-shadow:0 6px 0 #f0abfc;border:3px solid #fbcfe8}

/* ===================== Red Words (OG heart words) ===================== */
.tile.live.red{background:linear-gradient(135deg,#ff6fa5,#c084fc);grid-column:auto;min-height:170px}
.tile.live.red h3{font-size:32px}.tile.live.red .t-icon{font-size:72px}
.tile.live.red .play-badge{color:#ec4899}
.rw-word{display:inline-flex;align-items:baseline;letter-spacing:1px;white-space:nowrap}
.rw-word .rl{display:inline-block}
.rw-word .rpart{color:#ef2b5f;position:relative}
.rw-word .rpart::after{content:"♥";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);font-size:.38em;color:#ff4f8b}
.rw-word.huge{font-size:clamp(84px,12vw,150px);line-height:1.15;padding-top:.15em}
.rw-word.huge2{font-size:clamp(60px,8vw,104px);line-height:1.15;padding-top:.15em}
.rw-word.mid{font-size:1.25em}
.rw-word.sm{font-size:22px}.rw-word.sm .rpart::after{top:-.5em}
.redtxt{color:#ef2b5f}
.rw-sent{font-size:clamp(22px,2.6vw,30px);color:#4c1d95;background:#faf5ff;border-radius:16px;padding:10px 16px;margin:10px auto;text-align:center;font-weight:700;max-width:100%}
.rw-hl{color:#ef2b5f;background:#ffe4ec;border-radius:8px;padding:0 6px}
.rw-blank{color:#c4b5fd;letter-spacing:2px}
.rw-badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.rw-badge.s-new{background:#f1f5f9;color:#64748b}.rw-badge.s-learning{background:#dcfce7;color:#15803d}.rw-badge.s-known{background:#fce7f3;color:#be185d}.rw-badge.s-mastered{background:#fef3c7;color:#b45309}
/* hub */
.rw-hub{display:flex;flex-direction:column;gap:14px}
.rw-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rw-lvl,.rw-pool{background:#fff;border-radius:22px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid transparent;color:var(--ink);min-height:120px;position:relative}
.rw-lvl .li,.rw-pool .li{font-size:38px;line-height:1.1}
.rw-lvl b,.rw-pool b{font-size:20px;color:var(--lc)}
.rw-lvl small,.rw-pool small{font-size:13px;color:var(--muted)}
.rw-lvl .lp{font-size:13px;background:#f5f3ff;border-radius:999px;padding:2px 10px;margin-top:4px}
.rw-lvl.sel,.rw-pool.sel{border-color:var(--lc);transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,255,255,.6)}
.rw-pool:disabled{opacity:.5}
.rw-pool .st{font-size:13px;color:var(--purple)}
.rw-pools{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rw-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rw-act{display:flex;gap:14px;align-items:center}
.rw-act .ra-icon{font-size:54px;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#fce7f3}
.rw-act.prac .ra-icon{background:#dcfce7}
.rw-act h3{margin:0;font-size:24px}.rw-act p{margin:4px 0 10px;color:var(--muted);font-size:16px}
.rw-act .btn:disabled,.play-big:disabled{opacity:.45;filter:grayscale(.6);animation:none}
.rw-garden .rg-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:18px}
.rw-garden .rg-head span{font-size:14px;color:var(--muted)}
.rg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.rg-word{background:#f8fafc;border-radius:16px;padding:8px 6px 6px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.1);border:3px solid transparent;min-height:78px;justify-content:center}
.rg-word i{font-style:normal;font-size:16px}
.rg-word .rw-word .rpart::after{display:none}
.rg-word.s-new{color:#94a3b8;border:3px dashed #e2e8f0;background:#fff}
.rg-word.s-new:not(:disabled){border-color:#ff4f8b;color:#be185d;animation:pulseTile 1.4s infinite}
.rg-word.s-learning{background:#f0fdf4}.rg-word.s-known{background:#fdf2f8}.rg-word.s-mastered{background:#fffbeb;border-color:#fcd34d}
.rg-word:disabled{cursor:default;opacity:.7}
/* learn */
#s-redlearn,#s-redplay{padding:12px 14px}
.rl-steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.rl-step{background:rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.rl-step i{font-style:normal}
.rl-step.done{background:rgba(255,255,255,.7);color:#4c1d95}
.rl-step.cur{background:#fff;color:#ec4899;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:scale(1.08)}
.rl-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:0;overflow:auto}
.rl-title{font-size:clamp(22px,2.6vw,30px);color:var(--ink);max-width:900px}
.rl-title small{display:block;font-size:.65em;color:var(--muted)}
.rl-sub{font-size:20px;color:var(--muted)}
.rl-big{margin:4px 0}
.rl-hints{display:flex;flex-direction:column;gap:6px;align-items:center}
.rl-hint{background:#fff1f5;color:#be185d;border-radius:14px;padding:6px 14px;font-size:clamp(17px,2vw,21px)}
.rl-taps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.rl-tap{position:relative;width:clamp(70px,9vw,104px);height:clamp(84px,11vw,124px);border-radius:22px;font-size:clamp(50px,7vw,80px);background:linear-gradient(180deg,#fff,#f5f3ff);border:4px solid #c4b5fd;box-shadow:0 7px 0 #a78bfa;color:var(--ink);transition:transform .1s}
.rl-tap.red{color:#ef2b5f;border-color:#fda4af;box-shadow:0 7px 0 #fb7185;background:linear-gradient(180deg,#fff,#fff1f5)}
.rl-tap i{position:absolute;top:2px;right:8px;font-size:18px;font-style:normal;color:#ff4f8b}
.rl-tap.next{animation:nextTap .9s ease-in-out infinite;border-color:var(--gold)}

<script>
/* Naomi's Math Quest - pure game logic (no DOM). Usable in the browser and in Node tests. */
(function (root) {
  'use strict';

  var OPS = ['add', 'sub', 'mul', 'div', 'mixed'];
  var OP_INFO = {
    add:   { name: 'Addition',       sym: '+', icon: '➕', color: '#ff4f8b' },
    sub:   { name: 'Subtraction',    sym: '−', icon: '➖', color: '#ff9f1c' },
    mul:   { name: 'Multiplication', sym: '×', icon: '✖️', color: '#2ec4b6' },
    div:   { name: 'Division',       sym: '÷', icon: '➗', color: '#3a86ff' },
    mixed: { name: 'Mixed',          sym: '?', icon: '🎲', color: '#9b5de5' }
  };
  var DIFFS = ['easy', 'medium', 'hard', 'op'];
  var DIFF_INFO = {
    easy:   { name: 'Easy',   mult: 1,   color: '#22c55e' },
    medium: { name: 'Medium', mult: 1.5, color: '#eab308' },
    hard:   { name: 'Hard',   mult: 2,   color: '#f97316' },
    op:     { name: 'OP',     mult: 3,   color: '#ef4444' }
  };
  var MODES = ['streak', 'speed'];

  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }

  function make(op, diff, terms, answer) {
    var sym = { add: '+', sub: '−', mul: '×', div: '÷' }[op];
    var keySym = { add: '+', sub: '-', mul: 'x', div: '/' }[op];
    return {
      op: op, diff: diff, terms: terms, answer: answer,
      text: terms.join(' ' + sym + ' '),
      key: terms.join(keySym)
    };
  }

  // ---- Generators. Ranges chosen for a strong 2nd grader. All answers are whole numbers >= 0.
  function genAdd(diff, rng) {
    var a, b;
    switch (diff) {
      case 'easy':   a = ri(rng, 0, 10); b = ri(rng, 0, 10 - a); break;          // sums within 10
      case 'medium': a = ri(rng, 1, 10); b = ri(rng, 1, 10); break;              // sums within 20
      case 'hard':   a = ri(rng, 6, 20); b = ri(rng, 4, 20); break;              // teen facts, up to 40
      default:                                                                   // OP
        if (rng() < 0.4) { var t = [ri(rng, 2, 9), ri(rng, 2, 9), ri(rng, 2, 9)];
          return make('add', diff, t, t[0] + t[1] + t[2]); }
        a = ri(rng, 11, 59); b = ri(rng, 11, 39);                                // 2-digit + 2-digit
    }
    return make('add', diff, [a, b], a + b);
  }
  function genSub(diff, rng) {
    var x, y;
    switch (diff) {
      case 'easy':   x = ri(rng, 0, 10); y = ri(rng, 0, x); break;               // within 10
      case 'medium': x = ri(rng, 6, 20); y = ri(rng, 1, Math.min(10, x)); break; // within 20
      case 'hard':   x = ri(rng, 15, 40); y = ri(rng, 4, Math.min(20, x)); break;
      default:       x = ri(rng, 30, 99); y = ri(rng, 11, x); break;              // 2-digit − 2-digit
    }
    return make('sub', diff, [x, y], x - y);
  }
  function genMul(diff, rng) {
    var a, b;
    switch (diff) {
      case 'easy':   a = pick(rng, [0, 1, 2, 5, 10]); b = ri(rng, 0, 10); break;
      case 'medium': a = ri(rng, 0, 5); b = ri(rng, 0, 10); break;
      case 'hard':   a = ri(rng, 2, 10); b = ri(rng, 2, 10); break;
      default:       a = ri(rng, 3, 12); b = ri(rng, 6, 12); break;                // up to 12 × 12
    }
    if (rng() < 0.5) { var t = a; a = b; b = t; }
    return make('mul', diff, [a, b], a * b);
  }
  function genDiv(diff, rng) {
    var d, q;
    switch (diff) {
      case 'easy':   d = pick(rng, [1, 2, 5, 10]); q = ri(rng, 0, 10); break;
      case 'medium': d = ri(rng, 1, 5); q = ri(rng, 0, 10); break;
      case 'hard':   d = ri(rng, 2, 10); q = ri(rng, 2, 10); break;
      default:       d = ri(rng, 3, 12); q = ri(rng, 3, 12); break;
    }
    return make('div', diff, [d * q, d], q);                                     // always exact
  }
  var GEN = { add: genAdd, sub: genSub, mul: genMul, div: genDiv };

  function generate(op, diff, rng) {
    rng = rng || Math.random;
    var real = op === 'mixed' ? pick(rng, ['add', 'sub', 'mul', 'div']) : op;
    return GEN[real](diff, rng);
  }

  // ---- Adaptive practice.
  // Each fact keeps: seen, wrong, miss (re-ask weight, decays as she gets it right), cstreak
  // (correct answers in a row), ms (smoothed response time on correct answers).
  var FLUENT_MS = 4000;   // default: answered correctly within 4s (incl. typing) counts as fluent
  function recordAnswer(facts, problem, correct, ms) {
    var f = facts[problem.key];
    if (!f) f = facts[problem.key] = { key: problem.key, op: problem.op, diff: problem.diff,
      terms: problem.terms, answer: problem.answer, text: problem.text, seen: 0, wrong: 0, miss: 0, cstreak: 0, ms: 0 };
    f.seen++;
    f.last = Date.now();
    if (correct) {
      f.miss = Math.max(0, f.miss - 1);
      f.cstreak = (f.cstreak || 0) + 1;
      if (ms > 0) f.ms = f.ms ? Math.round(f.ms * 0.6 + ms * 0.4) : Math.round(ms);
    } else {
      f.wrong++; f.miss = Math.min(8, f.miss + 3); f.cstreak = 0;
    }
    return f;
  }
  function fromFact(f) { var p = make(f.op, f.diff, f.terms.slice(), f.answer); p.review = true; return p; }

  // ---- Mastery of one fact. new -> struggling / learning -> known -> fluent.
  var MASTERY = ['new', 'struggling', 'learning', 'known', 'fluent'];
  var MASTERY_INFO = {
    new:        { name: 'Not seen',   icon: '·',  color: '#e2e8f0', weight: 4 },
    struggling: { name: 'Struggling', icon: '🔁', color: '#fca5a5', weight: 5 },
    learning:   { name: 'Learning',   icon: '🌱', color: '#fde68a', weight: 3 },
    known:      { name: 'Known',      icon: '✅', color: '#bbf7d0', weight: 2 },
    fluent:     { name: 'Fluent',     icon: '⚡', color: '#4ade80', weight: 1 }
  };
  function mastery(f, fluentMs) {
    if (!f || !f.seen) return 'new';
    if (f.miss > 0) return 'struggling';
    if ((f.cstreak || 0) < 3) return 'learning';
    if (f.ms && f.ms <= (fluentMs || FLUENT_MS)) return 'fluent';
    return 'known';
  }

  // ---- The finite set of facts each (op, level) can produce; mirrors the generators above.
  // Returns null for open-ended levels (2-digit addition / subtraction) where the space is huge.
  var spaceCache = {};
  function factSpace(op, diff) {
    if (op === 'mixed') {
      var all = [];
      ['add', 'sub', 'mul', 'div'].forEach(function (o) { var sp = factSpace(o, diff); if (sp) all = all.concat(sp); });
      return all.length ? all : null;
    }
    var ck = op + '|' + diff;
    if (ck in spaceCache) return spaceCache[ck];
    var out = [], seen = {}, a, b, x, y, d, q;
    function add(o, t, ans) { var p = make(o, diff, t, ans); if (!seen[p.key]) { seen[p.key] = 1; out.push(p); } }
    function both(a, b) { add('mul', [a, b], a * b); add('mul', [b, a], a * b); }
    if (op === 'add') {
      if (diff === 'easy') { for (a = 0; a <= 10; a++) for (b = 0; b <= 10 - a; b++) add('add', [a, b], a + b); }

  function factGridHtml(op, fm) {

    var inSpace = {}; space.forEach(function (p) { inSpace[p.key] = p; });

    ['add', 'sub', 'mul', 'div'].forEach(function (op) {
      var rec = L.recommendDiff(S.facts, op, FM);
      h += '<tr><td><b>' + L.OP_INFO[op].name + '</b><br><span class="p-note">next: ' + L.DIFF_INFO[rec].name + '</span></td>';
      L.DIFFS.forEach(function (d) {
        var m = L.masterySummary(S.facts, op, d, FM), c = m.counts;
        if (!m.total) { h += '<td><span class="p-note">not played</span></td>'; return; }
        var seen = m.total - c.new;
        h += '<td><div class="mbar" title="fluent / known / learning / struggling / not seen">' +
          '<i style="width:' + (c.fluent / m.total * 100) + '%;background:' + L.MASTERY_INFO.fluent.color + '"></i>' +
          '<i style="width:' + (c.known / m.total * 100) + '%;background:' + L.MASTERY_INFO.known.color + '"></i>' +
          '<i style="width:' + (c.learning / m.total * 100) + '%;background:' + L.MASTERY_INFO.learning.color + '"></i>' +
          '<i style="width:' + (c.struggling / m.total * 100) + '%;background:' + L.MASTERY_INFO.struggling.color + '"></i></div>' +
          '<b>' + Math.round(m.pct * 100) + '%</b> ' + (m.ready ? '✅ ready' : '') + '<br><span class="p-note">⚡' + c.fluent + ' ✅' + c.known + ' 🌱' + c.learning + ' 🔁' + c.struggling + ' · ' + (m.open ? seen + ' met ∞' : seen + '/' + m.total + ' met') + '</span></td>';
      });
      h += '</tr>';
    });
    h += '</table></div>';
    // fact grids
    h += '<div class="p-note" style="margin-top:12px">Tap an operation to see every fact. Rows × columns = the two numbers; blank cells are not in any level.</div><div class="grid-tabs">';
    ['add', 'sub', 'mul', 'div'].forEach(function (op) { h += '<button class="btn small ' + (gridOp === op ? 'blue' : 'white') + '" data-act="grid-op" data-v="' + op + '">' + L.OP_INFO[op].icon + ' ' + L.OP_INFO[op].name + '</button>'; });
    h += '</div>' + factGridHtml(gridOp, FM) + '</div>';
    // 14-day trend
    var dayMap = {}, keys = [], t14 = Date.now() - 13 * 864e5;
    for (var di = 0; di < 14; di++) { var dk = dayKey(t14 + di * 864e5); keys.push(dk); dayMap[dk] = { p: 0, c: 0, ms: 0, n: 0, s: 0 }; }
    ss.forEach(function (x) { var k = dayKey(x.ts); if (dayMap[k]) { var o = dayMap[k]; o.p += x.problems; o.c += x.correct; o.ms += x.avgMs * x.problems; o.n += x.problems; o.s++; } });
    var maxP = 1; keys.forEach(function (k) { maxP = Math.max(maxP, dayMap[k].p); });
    h += '<div class="p-card wide"><h3>📈 Last 14 days</h3><div class="trend">';
    keys.forEach(function (k) {
      var o = dayMap[k], acc = o.p ? Math.round(o.c / o.p * 100) : null, d = new Date(k.split('-')[0], k.split('-')[1] - 1, k.split('-')[2]);
      h += '<div class="tcol"><div class="tbar-wrap"><div class="tbar" style="height:' + (o.p / maxP * 100) + '%;background:' + (acc === null ? '#e2e8f0' : acc >= 90 ? '#4ade80' : acc >= 75 ? '#fde68a' : '#fca5a5') + '"></div></div>' +
        '<b>' + (o.p || '') + '</b><span>' + (acc === null ? '' : acc + '%') + '</span><span>' + (o.n ? (o.ms / o.n / 1000).toFixed(1) + 's' : '') + '</span><small>' + d.toLocaleDateString([], { weekday: 'short' }).slice(0, 2) + '<br>' + (d.getMonth() + 1) + '/' + d.getDate() + '</small></div>';
    });
    h += '</div><div class="p-note">Bar = problems that day (green ≥90% accuracy, yellow ≥75%, red below). Below each: problems, accuracy, average seconds per problem.</div></div>';
    // module progress
    h += '<div class="p-card wide"><h3>🧭 Progress by module</h3><div class="scroll-x"><table class="mod-table"><tr><th>Module</th>';
    L.DIFFS.forEach(function (d) { h += '<th>' + L.DIFF_INFO[d].name + ' 🔥 streak</th><th>' + L.DIFF_INFO[d].name + ' ⏱️ speed</th>'; });
    h += '</tr>';
    L.OPS.forEach(function (op) {
      h += '<tr><td><b>' + L.OP_INFO[op].name + '</b></td>';
      L.DIFFS.forEach(function (d) {
        var a = S.modules[L.moduleKey(op, d, 'streak')], bs = [];
        L.METHODS.forEach(function (m) { var r = S.modules[L.recordKey(op, d, 'speed', m)]; if (r) bs.push(L.METHOD_INFO[m].icon + ' ' + (r.best ? L.fmtTime(r.best) : 'not finished')); });
        h += '<td>' + (a ? starStr(a.stars) + '<br><span class="p-note">best ' + a.best + '</span>' : '<span class="p-note">-</span>') + '</td>';
        h += '<td>' + (bs.length ? starStr(starsFor(op, d, 'speed')) + '<br><span class="p-note">' + bs.join('<br>') + '</span>' : '<span class="p-note">-</span>') + '</td>';
      });
      h += '</tr>';
    });
    h += '</table></div></div>';
    // session log
    h += '<div class="p-card wide"><h3>📝 Session log (latest 40)</h3><div class="scroll-x"><table><tr><th>When</th><th>Module</th><th>Mode</th><th>Answered by</th><th>Correct</th><th>Accuracy</th><th>Avg / problem</th><th>Result</th><th>Stars</th><th>Coins</th><th>Missed</th></tr>';
    ss.slice(-40).reverse().forEach(function (s) {
      h += '<tr><td>' + new Date(s.ts).toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</td><td>' + L.OP_INFO[s.op].name + ' ' + L.DIFF_INFO[s.diff].name + '</td><td>' + s.mode + '</td><td>' + methodLabel(s.method) + (s.method === 'write' && s.rereads ? '<br><span class="p-note">' + s.rereads + ' re-write' + (s.rereads > 1 ? 's' : '') + '</span>' : '') + '</td><td>' + s.correct + '/' + s.problems + '</td><td>' + (s.problems ? Math.round(s.correct / s.problems * 100) : 0) + '%</td><td>' + (s.avgMs / 1000).toFixed(1) + 's</td><td>' +
        (s.mode === 'speed' ? (s.finished ? L.fmtTime(s.durationMs) : 'stopped') : 'streak ' + s.bestStreak) + '</td><td>' + s.stars + '</td><td>' + s.coins + '</td><td class="p-note">' + esc((s.misses || []).slice(0, 6).join(', ')) + (s.fixed ? '<br>' + s.fixed + ' re-typed ✔' : '') + '</td></tr>';
    });
    if (!ss.length) h += '<tr><td colspan="11" class="p-note">No sessions yet.</td></tr>';
    h += '</table></div></div>';
    if (RW) h += RW.parentHtml();
    // conversion
    h += '<div class="p-card"><h3>💱 Coin → real reward conversion</h3><div class="p-note">She trades coins for these in the Treasure screen. Nothing connects to Roblox or any payment. You hand out the reward and tap "Given".</div>';
    S.settings.rewards.forEach(function (r, i) {
      h += '<div class="p-row" style="border-top:1px solid #e2e8f0;padding-top:8px"><input type="text" style="width:56px" data-rw="' + i + '" data-f="icon" value="' + esc(r.icon) + '"><input type="text" data-rw="' + i + '" data-f="name" value="' + esc(r.name) + '">' +
        '<label><input type="checkbox" data-rw="' + i + '" data-f="enabled"' + (r.enabled ? ' checked' : '') + '> on</label></div>' +
        '<div class="p-row"><input type="number" inputmode="numeric" data-rw="' + i + '" data-f="cost" value="' + r.cost + '"><label>coins =</label><input type="number" inputmode="numeric" data-rw="' + i + '" data-f="amount" value="' + r.amount + '"><input type="text" style="width:110px" data-rw="' + i + '" data-f="unit" value="' + esc(r.unit) + '"><button class="btn gray small" data-act="rw-del" data-v="' + i + '">🗑</button></div>';
    });
    h += '<div class="p-row"><button class="btn small blue" data-act="rw-add">＋ Add reward</button><button class="btn small green" data-act="rw-save">Save rewards</button><span id="rw-msg" class="p-note"></span></div></div>';
    // settings
    h += '<div class="p-card"><h3>⚙️ Settings</h3>' +
      '<div class="p-row"><label>Player name</label><input type="text" id="set-name" value="' + esc(S.name) + '" maxlength="16"><button class="btn small blue" data-act="set-name">Save</button></div>' +
      '<div class="p-row"><label>New 4-digit PIN</label><input type="text" id="set-pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••"><button class="btn small blue" data-act="set-pin">Change PIN</button><span id="pin-msg" class="p-note"></span></div>' +
      '<div class="p-row"><label><input type="checkbox" id="set-auto"' + (S.settings.autoSubmit ? ' checked' : '') + ' data-act="set-auto"> Auto-submit when the answer has enough digits (faster speed runs)</label></div>' +
      '<div class="p-row"><label><input type="checkbox" id="set-sound"' + (S.settings.sound ? ' checked' : '') + ' data-act="set-sound"> Sound effects</label></div>' +
      '<div class="p-row"><label><input type="checkbox" id="set-fix"' + (S.settings.fixAfterMiss ? ' checked' : '') + ' data-act="set-fix"> After a miss, she re-enters the correct answer before moving on (recommended)</label></div>' +
      '<div class="p-row"><label>Fluent = correct within</label><select id="set-fluent" data-act="set-fluent">' + [3000, 4000, 5000, 6000, 8000].map(function (v) { return '<option value="' + v + '"' + (S.settings.fluentMs === v ? ' selected' : '') + '>' + (v / 1000) + 's</option>'; }).join('') + '</select><span class="p-note">includes reading and typing time; 4s is a fair 2nd-grade target on the number pad, use more for Write It</span></div>' +
      '<div class="p-row" style="border-top:1px solid #e2e8f0;padding-top:10px"><button class="btn small white" data-act="export">⬇ Backup file</button><label class="btn small white" style="cursor:pointer">⬆ Restore<input type="file" id="import-file" accept="application/json,.json" style="display:none"></label></div>' +
      '<div class="p-note">Progress is saved in this browser only. Use Backup before clearing Safari data or switching devices.</div>' +
      '<div class="p-row" style="margin-top:10px"><button class="btn small pink" data-act="reset">Reset all progress</button></div></div>';
    h += '</div>';
    $('#s-parent').innerHTML = h;
  };

  var RENDER_home, RENDER_math, RENDER_play, RENDER_results, RENDER_closet, RENDER_shop, RENDER_parent;
  var RENDER = {};
  function bindRenders() {
    RENDER = { home: RENDER_home, math: RENDER_math, play: RENDER_play, results: RENDER_results, closet: RENDER_closet, shop: RENDER_shop, parent: RENDER_parent };
    if (RW) { var rr = RW.renders; for (var k in rr) RENDER[k] = rr[k]; }
  }

  // ---------------------------------------------------------------- events
  function act(name, v, el) {
    switch (name) {
      case 'home': inkCancelTimers(); G = null; show('home'); break;
      case 'math': show('math'); break;
      case 'red': if (RW) { RW.stop(); show('red'); } break;
      case 'closet':
        if (closetTab !== 'look' && !L.CATALOG.some(function (it) { return it.slot === closetTab && S.owned[it.id]; })) {
          var firstOwned = TABS.filter(function (t) { return L.CATALOG.some(function (it) { return it.slot === t[0] && S.owned[it.id]; }); })[0];
          if (firstOwned) closetTab = firstOwned[0];
        }
        show('closet'); break;
      case 'shop': show('shop'); break;
      case 'parent': pinBuf = ''; pinModal(); break;
      case 'modal-close': closeModal(); break;
      case 'mute':
        S.settings.sound = !S.settings.sound; save();
        if (current === 'play' || (RW && RW.isLive(current))) { el.textContent = S.settings.sound ? '🔊' : '🔇'; } else show(current);
        break;
      case 'pick-op': S.last.op = v; save(); RENDER_math(); break;
      case 'pick-diff': S.last.diff = v; save(); RENDER_math(); break;
      case 'pick-mode': S.last.mode = v; save(); RENDER_math(); break;
      case 'pick-method': if (L.METHOD_INFO[v]) { S.last.method = v; save(); SFX.tap(); RENDER_math(); } break;
      case 'ink-clear': if (G && !G.locked && INK) { inkClear(); SFX.tap(); } break;
      case 'ink-go': if (G && !G.locked && INK && INK.strokes.length) inkRecognize(true); break;
      case 'play': case 'again': startGame(); break;
      case 'quit':
        if (!G) { show('math'); break; }
        inkCancelTimers();
        if (G.total === 0) { G.running = false; G.done = true; cancelAnimationFrame(rafId); G = null; show('math'); }
        else endGame(false);
        break;
      case 'hatch': openEggs(); break;
      case 'egg-tap': tapEgg(); break;
      case 'egg-next': hatch = { taps: 0, result: null }; renderEgg(); break;
      case 'egg-wear': var it = hatch.result.item; S.equipped[it.slot] = it.id; save(); if (S.eggs.length) { hatch = { taps: 0, result: null }; renderEgg(); } else closeEggs(); splash('LOOKIN\' GOOD!', 'l2', 0); break;
      case 'egg-done': case 'egg-later': closeEggs(); break;
      case 'tab': closetTab = v; RENDER_closet(); break;
      case 'equip': var item = L.CATALOG_BY_ID[v]; S.equipped[item.slot] = S.equipped[item.slot] === v ? undefined : v; if (!S.equipped[item.slot]) delete S.equipped[item.slot]; save(); SFX.tap(); RENDER_closet(); break;
      case 'skin': S.look.skin = +v; save(); RENDER_closet(); break;
      case 'hair': S.look.hair = +v; save(); RENDER_closet(); break;
      case 'hstyle': S.look.style = +v; save(); SFX.tap(); RENDER_closet(); break;
      case 'request':
        var r = S.settings.rewards.filter(function (x) { return x.id === v; })[0];
        if (!r || S.coins < r.cost) break;
        modal('<div style="font-size:70px">' + esc(r.icon) + '</div><h2>Trade ' + r.cost + ' 🪙 for ' + r.amount + ' ' + esc(r.unit) + '?</h2><div class="btn-row"><button class="btn green" data-act="request-yes" data-v="' + esc(r.id) + '">Yes!</button><button class="btn gray" data-act="modal-close">No</button></div>');
        break;
      case 'request-yes':
        var rr = S.settings.rewards.filter(function (x) { return x.id === v; })[0];
        if (rr && S.coins >= rr.cost) {
          S.coins -= rr.cost;
          S.requests.push({ id: 'q' + Date.now(), rid: rr.id, icon: rr.icon, name: rr.name, amount: rr.amount, unit: rr.unit, cost: rr.cost, ts: Date.now(), status: 'pending' });
          save(); SFX.reward(); confetti(120); splash('TREASURE! 🎁', 'reward', 0);
        }
        closeModal(); show('shop'); break;
      case 'redeem': case 'decline':
        S.requests.forEach(function (q) {
          if (q.id === v && q.status === 'pending') { q.status = name === 'redeem' ? 'redeemed' : 'refunded'; q.doneTs = Date.now(); if (name === 'decline') S.coins += q.cost; }
        });
        save(); RENDER_parent(); break;
      case 'adj-coins': var n = parseInt($('#adj-coins').value, 10); if (!isNaN(n)) { S.coins = Math.max(0, S.coins + n); save(); RENDER_parent(); } break;
      case 'rw-save': readRewards(); save(); $('#rw-msg').textContent = 'Saved ✔'; break;
      case 'rw-add': readRewards(); S.settings.rewards.push({ id: 'r' + Date.now(), icon: '⭐', name: 'New reward', cost: 100, amount: 1, unit: 'treat', enabled: true }); save(); RENDER_parent(); break;
      case 'rw-del': readRewards(); S.settings.rewards.splice(+v, 1); save(); RENDER_parent(); break;
      case 'set-name': var nm = $('#set-name').value.trim(); if (nm) { S.name = nm.slice(0, 16); save(); document.title = S.name + "'s Brain Quest"; $('#set-name').blur(); } break;
      case 'set-pin':
        var p = $('#set-pin').value.trim();
        if (/^\d{4}$/.test(p)) { S.settings.pin = p; save(); $('#pin-msg').textContent = 'PIN changed ✔'; $('#set-pin').value = ''; }
        else $('#pin-msg').textContent = 'Use exactly 4 digits';
        break;
      case 'set-auto': S.settings.autoSubmit = el.checked; save(); break;
      case 'set-fix': S.settings.fixAfterMiss = el.checked; save(); break;
      case 'set-fluent': S.settings.fluentMs = parseInt(el.value, 10) || 4000; save(); RENDER_parent(); break;
      case 'grid-op': gridOp = v; RENDER_parent(); break;
      case 'set-sound': S.settings.sound = el.checked; save(); break;
      case 'export':
        var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'brain-quest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        break;
      case 'reset':
        if (confirm('Erase ALL progress, coins, items and history? This cannot be undone.')) { var pin = S.settings.pin; S = defaults(); S.settings.pin = pin; save(); show('home'); }
        break;
      default: if (RW) RW.act(name, v, el);
    }
  }
  function readRewards() {
    document.querySelectorAll('[data-rw]').forEach(function (inp) {
      var r = S.settings.rewards[+inp.dataset.rw], f = inp.dataset.f; if (!r) return;
      if (f === 'enabled') r.enabled = inp.checked;
      else if (f === 'cost' || f === 'amount') { var n = parseInt(inp.value, 10); if (n > 0) r[f] = n; }
      else if (inp.value.trim()) r[f] = inp.value.trim().slice(0, 24);
    });
  }

  function bindEvents() {
    // number pad: pointerdown for instant response on iPad
    document.addEventListener('pointerdown', function (e) {
      var k = e.target.closest('[data-key]');
      if (k) { e.preventDefault(); k.classList.add('down'); setTimeout(function () { k.classList.remove('down'); }, 120); press(k.dataset.key); return; }
      var b = e.target.closest('[data-bub]');
      if (b) { e.preventDefault(); popBubble(b); return; }
      var p = e.target.closest('[data-pin]');
      if (p) { e.preventDefault(); pinPress(p.dataset.pin); }
    });
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t || t.disabled) return;
      if (t.tagName === 'INPUT') { act(t.dataset.act, t.dataset.v, t); return; }
      act(t.dataset.act, t.dataset.v, t);
    });
    document.addEventListener('change', function (e) {
      if (e.target.tagName === 'SELECT' && e.target.dataset.act) { act(e.target.dataset.act, e.target.value, e.target); return; }
      if (e.target.id === 'import-file' && e.target.files[0]) {
        var fr = new FileReader();
        fr.onload = function () {
          try { var d = JSON.parse(fr.result); if (!d || !d.settings || !d.modules) throw 0; if (confirm('Replace current progress with this backup?')) { S = d; save(); load(); show('parent'); } }
          catch (err) { alert('That file does not look like a Brain Quest / Math Quest backup.'); }
        };
        fr.readAsText(e.target.files[0]);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (RW && RW.isLive(current)) { RW.key(e); return; }
      if (current !== 'play' || !G) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
      else if (e.key === 'Enter') { if (G.method === 'write') act('ink-go'); else press('go'); }
    });
    // prevent iOS double-tap zoom / pinch on the game
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('visibilitychange', function () { save(); });
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    load();
    if (window.NMQRed) RW = window.NMQRed.init({
      state: function () { return S; }, save: save, show: show, current: function () { return current; }, SFX: SFX, splash: splash, confetti: confetti,
      flashShake: flashShake, topbar: topbar, esc: esc, starStr: starStr, modal: modal, closeModal: closeModal, openEggs: openEggs, countdown: countdown,
      fmtClock: fmtClock, praise: PRAISE, redDefaults: redDefaults, rerenderParent: function () { RENDER_parent(); }
    });
    MAX_STARS = MATH_MAX_STARS + (RW ? RW.maxStars : 0);
    bindRenders(); bindEvents();
    document.title = S.name + "'s Brain Quest";
    show('home');
  }
  // tiny debug/test hook (no network, local only)
  window.NMQApp = {
    state: function () { return S; }, show: function (n) { show(n); }, startGame: startGame, press: press, endGame: endGame,
    openEggs: openEggs, tapEgg: tapEgg, save: save, reload: function () { load(); show(current); }, game: function () { return G; },
    red: function () { return RW && RW.debug(); },
    ink: function () { return INK ? { strokes: INK.strokes.length, read: INK.read && { text: INK.read.text, ok: INK.read.ok, reason: INK.read.reason } } : null; }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
