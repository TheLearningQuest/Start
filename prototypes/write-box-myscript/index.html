<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Write Cloud">
<meta name="theme-color" content="#ffb7d5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src https://cloud.myscript.com wss://cloud.myscript.com; media-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<title>Write box · MyScript</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="pick">
<div id="stage">
  <details id="key-panel" open>
    <summary id="key-summary">Add MyScript keys</summary>
    <form id="key-form" autocomplete="off">
      <p class="key-note">Paste both keys once. They stay on this iPad. Ink goes to MyScript only when she taps Check.</p>
      <label for="key-app">Application key
        <input id="key-app" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      </label>
      <label for="key-hmac">HMAC key
        <input id="key-hmac" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      </label>
      <p id="key-error" role="alert" hidden></p>
      <button id="key-save" type="submit">Save</button>
    </form>
    <div id="key-saved" hidden>
      <p id="key-mask"></p>
      <button id="clear-keys" type="button">Clear keys</button>
    </div>
  </details>
  <header id="top">
    <button id="words" type="button" hidden>Words</button>
    <p id="hint" aria-live="polite">Pick a heart word.</p>
    <div id="tools">
      <button id="hear" type="button" hidden>Hear it</button>
      <button id="clear" type="button" hidden>Clear</button>
      <button id="next" type="button" hidden>Next</button>
      <button id="calm" type="button" aria-pressed="false">Calm</button>
      <button id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>

  <section id="pick">
    <h1>Write box</h1>
    <p class="lead">Hear a heart word. Write it in the big box. Tap Check.</p>
    <p class="privacy">Check sends the ink to MyScript Cloud. One read each tap.</p>
    <div id="word-grid"></div>
  </section>

  <div id="play" hidden>
    <div id="prompt">
      <p id="show"></p>
      <p id="sentence"></p>
    </div>
    <div id="paper">
      <p id="ghost">Write here</p>
      <div id="ink" role="img" aria-label="Writing box"></div>
      <div id="burst" aria-hidden="true"></div>
    </div>
    <p id="cloud" hidden></p>
    <button id="check" type="button">Check</button>
  </div>
</div>
<svg id="heart-shape" viewBox="0 0 24 22" hidden>
  <path fill="#ff3d84" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" d="M12 20.4C8.4 17.2 2.2 13.1 2.2 8.2 2.2 5.1 4.5 3.1 7 3.5c1.7.2 2.9 1.3 3.6 2.5.6-1.5 2-2.6 3.8-2.6 2.7 0 5 1.9 5 5.1 0 4.9-5.4 8.8-7.4 11.9z"/>
  <ellipse cx="7.4" cy="6.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.85"/>
</svg>
<script src="config.local.js"></script>
<script src="vendor/iink.min.js"></script>
<script src="js/words.js"></script>
<script src="js/speech.js"></script>
<script src="js/check.js"></script>
<script src="js/app.js"></script>
</body>
</html>
