<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jumble Spell">
<meta name="theme-color" content="#ffb7d5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<title>Jumble Spell</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="pick">
<div id="stage">
  <header id="top">
    <button id="words" type="button" hidden>Words</button>
    <p id="hint">Pick a heart word.</p>
    <div id="tools">
      <button id="hear" type="button" hidden>Hear it</button>
      <button id="another" type="button" hidden>Another word</button>
      <button id="calm" type="button" aria-pressed="false">Calm</button>
      <button id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>

  <section id="pick">
    <h1>Jumble spell</h1>
    <p class="lead">Tap a word. The letters jumble, extra letters fly in, and you drag them back.</p>
    <div id="word-grid"></div>
  </section>

  <div id="board" hidden>
    <div id="slots"></div>
    <div id="cards"></div>
    <div id="burst" aria-hidden="true"></div>
  </div>

  <p id="live" class="sr" aria-live="polite"></p>
</div>
<svg id="heart-shape" viewBox="0 0 24 22" hidden>
  <path fill="#ff3d84" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" d="M12 20.4C8.4 17.2 2.2 13.1 2.2 8.2 2.2 5.1 4.5 3.1 7 3.5c1.7.2 2.9 1.3 3.6 2.5.6-1.5 2-2.6 3.8-2.6 2.7 0 5 1.9 5 5.1 0 4.9-5.4 8.8-7.4 11.9z"/>
  <ellipse cx="7.4" cy="6.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.85"/>
</svg>
<script src="js/words.js"></script>
<script src="js/table.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
