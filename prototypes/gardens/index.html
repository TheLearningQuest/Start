<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gardens">
<meta id="theme" name="theme-color" content="#ffd56a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<title>Kindergarten · Gardens</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="g-k" data-garden="k">
<div id="stage">
  <canvas id="view" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <header id="top">
    <h1 id="grade" data-i="0">Kindergarten</h1>
    <p id="line">Sunny patch · swipe sideways</p>
  </header>
  <div id="tools">
    <button id="calm" type="button" aria-pressed="false">Calm</button>
    <button id="sound" type="button" aria-pressed="true">Sound</button>
  </div>
  <button id="prev" class="chev" type="button" aria-label="Previous garden" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="next" class="chev" type="button" aria-label="Next garden">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <nav id="pager" aria-label="Grade gardens">
    <button type="button" data-i="0" aria-current="true" aria-label="Kindergarten">K</button>
    <button type="button" data-i="1" aria-label="1st grade">1st</button>
    <button type="button" data-i="2" aria-label="2nd grade">2nd</button>
  </nav>
  <p id="fail" hidden>These gardens need WebGL.</p>
  <ul class="sr">
    <li>Kindergarten garden, a sunny patch with flowers and empty spots.</li>
    <li>1st grade garden, a tulip pond with flowers and empty spots.</li>
    <li>2nd grade garden, a sunflower hill with flowers and empty spots.</li>
  </ul>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/pager.js"></script>
<script src="js/world.js"></script>
</body>
</html>
