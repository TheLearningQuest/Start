<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Words">
<meta name="theme-color" content="#ff8aa4">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<title>Red Words</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="view" aria-hidden="true"></canvas>
  <h1 class="sr">Red Words</h1>
  <div id="top">
    <p id="hint" aria-live="polite">Ease the stick. Drop when the ring turns green.</p>
  </div>
  <div id="joystick" role="slider" aria-label="Move the claw" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
    <div id="stick"></div>
    <span>Move</span>
  </div>
  <button id="drop" type="button">DROP</button>
  <p id="fail" hidden>This claw needs WebGL.</p>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/physics.js"></script>
<script src="js/game.js"></script>
</body>
</html>
