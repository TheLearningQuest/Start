<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prize">
<meta name="theme-color" content="#ff8ab8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<title>Prize Crack</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="lobby" data-prize="capsule">
<div id="stage">
  <header id="top">
    <p id="hint">Pick the prize you won.</p>
  </header>

  <section id="lobby" class="screen">
    <h1>A prize!</h1>
    <p class="lead">It rolled into the drawer.</p>
    <div class="drawer">
      <div class="knob" aria-hidden="true"></div>
      <button id="win-capsule" class="choice hero" type="button">
        <span class="thumb egg-thumb" aria-hidden="true"></span>
        <span class="choice-label">I won a capsule</span>
      </button>
      <button id="win-packet" class="choice alt" type="button">
        <span class="thumb pack-thumb" aria-hidden="true"></span>
        <span class="choice-label">I won a seed packet</span>
      </button>
      <button id="win-toy" class="choice alt" type="button">
        <span class="thumb toy-thumb" aria-hidden="true"></span>
        <span class="choice-label">I won a toy</span>
      </button>
    </div>
  </section>

  <section id="room" class="screen" hidden>
    <h1 class="sr" id="room-title">Open the prize</h1>
    <button id="prize" type="button" aria-label="Tap the capsule to crack it.">
      <span class="floor" aria-hidden="true"></span>
      <span class="art capsule live" data-kind="capsule">
        <span class="egg">
          <span class="half top">
            <span class="shine"></span>
            <span class="star"></span>
          </span>
          <span class="seam"></span>
          <span class="half bot"><span class="shine"></span></span>
          <svg class="cracks" viewBox="0 0 200 100" aria-hidden="true">
            <path class="k1" d="M38 58 L54 22 L70 74 L92 30"/>
            <path class="k2" d="M92 30 L112 78 L134 18 L156 70 L176 40"/>
            <path class="chip" d="M124 22 l20 -6 l8 18 -18 8 z"/>
          </svg>
        </span>
      </span>
      <span class="art packet" data-kind="packet" hidden>
        <span class="pack">
          <span class="mouth"></span>
          <span class="face">
            <span class="flower" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span>
            <span class="pack-name">Seeds</span>
          </span>
          <span class="seal"><span class="tab">Peel</span></span>
        </span>
      </span>
      <span class="art toy" data-kind="toy" hidden>
        <span class="gift">
          <span class="inside"></span>
          <span class="bow">
            <i class="loop l"></i>
            <i class="loop r"></i>
            <i class="knot"></i>
          </span>
          <span class="lid"></span>
          <span class="box"><span class="tag">Toy</span></span>
        </span>
      </span>
    </button>
  </section>

  <section id="reveal" class="screen" hidden>
    <div class="souvenirs" aria-hidden="true">
      <i class="half-top"></i>
      <i class="half-bot"></i>
      <i class="pack-bit"></i>
      <i class="toy-bit"></i>
    </div>
    <p id="kicker">Red word</p>
    <h1 id="word"></h1>
    <p id="sentence"></p>
    <div class="actions">
      <button id="hear" type="button">Hear it</button>
      <button id="again" type="button">Another prize</button>
    </div>
  </section>

  <p id="live" class="sr" aria-live="polite"></p>
  <div id="burst" aria-hidden="true"></div>
  <svg id="heart-shape" viewBox="0 0 24 22" hidden>
    <path fill="#ff3d84" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" d="M12 20.4C8.4 17.2 2.2 13.1 2.2 8.2 2.2 5.1 4.5 3.1 7 3.5c1.7.2 2.9 1.3 3.6 2.5.6-1.5 2-2.6 3.8-2.6 2.7 0 5 1.9 5 5.1 0 4.9-5.4 8.8-7.4 11.9z"/>
    <ellipse cx="7.4" cy="6.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.85"/>
  </svg>
</div>
<script src="js/words.js"></script>
<script src="js/speech.js"></script>
<script src="js/open.js"></script>
<script src="js/app.js"></script>
</body>
</html>
