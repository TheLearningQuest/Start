<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cole">
<title>Cole's Quest</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
  :root { --ink: #1e293b; --tap: 76px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(#7dd3fc, #fef9c3 55%, #bbf7d0);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; border: 0; background: none; color: inherit; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 4px solid #0f172a; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .screen { display: none; min-height: 100vh; min-height: 100dvh; padding: 12px; }
  .screen.on { display: block; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .back, .mute {
    width: 72px; height: 72px; border-radius: 50%; background: #fff;
    box-shadow: 0 6px 0 #94a3b8; display: grid; place-items: center; flex: 0 0 auto;
  }
  .back svg, .mute svg { width: 40px; height: 40px; }
  .mute { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 5; }
  .home { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .avatar-btn {
    background: rgba(255,255,255,.72); border-radius: 32px; padding: 8px 8px 12px;
    box-shadow: 0 8px 0 #38bdf8; display: flex; flex-direction: column; align-items: center;
  }
  .avatar { width: min(280px, 70vw); height: auto; }
  .stars { display: flex; gap: 4px; min-height: 28px; justify-content: center; }
  .stars svg { width: 28px; height: 28px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile {
    min-height: 148px; border-radius: 28px; background: #fff;
    box-shadow: 0 8px 0 #94a3b8; display: grid; place-items: center; padding: 10px;
  }
  .tile svg { width: 108px; height: 108px; }
  .tile.trace { box-shadow: 0 8px 0 #0284c7; }
  .tile.explore { box-shadow: 0 8px 0 #15803d; }
  .tile.color { box-shadow: 0 8px 0 #c2410c; }
  .tile.soon { background: #e2e8f0; box-shadow: 0 8px 0 #64748b; }
  .tile:active, .swatch:active, .choice:active, .gear-btn:active { transform: translateY(3px); }
  .pips { display: flex; gap: 8px; margin-left: auto; }
  .pip { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #64748b; }
  .pip.on { background: #f59e0b; box-shadow: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .swatch {
    width: 92px; height: 92px; border-radius: 50%; box-shadow: 0 6px 0 rgba(15,23,42,.25);
    border: 6px solid #fff;
  }
  .swatch.on { outline: 6px solid #0f172a; }
  .swatches.huge .swatch { width: 112px; height: 112px; }
  #color-step { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #preview svg { width: min(420px, 86vw); height: auto; }
  #board, #paper {
    width: 100%; height: min(68vh, 640px); height: min(68dvh, 640px);
    touch-action: none; background: transparent; display: block;
  }
  .paper { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
  .guide { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-dasharray: 1.8 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .guide.later { opacity: .28; }
  .guide.done { opacity: .15; }
  .fade .guide { opacity: .3; }
  .paint, .ink { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .under { fill: none; stroke: rgba(15,23,42,.3); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .paint { stroke-width: 7.2; }
  .arrow { fill: #f97316; stroke: #9a3412; stroke-width: .8; }
  .startdot { fill: #f97316; stroke: #fff; stroke-width: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; padding-bottom: 24px; }
  .glyph {
    aspect-ratio: 1; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #cbd5e1;
    display: grid; place-items: center; position: relative;
  }
  .glyph.lower { background: #fef9c7; }
  .glyph.num { background: #e0f2fe; }
  .glyph svg { width: 78%; height: 78%; }
  .glyph.next { outline: 5px solid #f97316; }
  .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .choices.three { grid-template-columns: 1fr 1fr 1fr; }
  .choice {
    min-height: 180px; border-radius: 28px; background: #fff; box-shadow: 0 8px 0 #94a3b8;
    display: grid; place-items: center; padding: 8px;
  }
  .choice svg { width: min(180px, 34vw); height: auto; }
  .pattern { display: flex; gap: 10px; justify-content: center; margin: 8px 0 16px; }
  .pattern svg { width: 72px; height: 72px; background: #fff; border-radius: 16px; }
  .gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
  .gear-btn {
    min-height: 124px; border-radius: 22px; background: #fff; box-shadow: 0 6px 0 #cbd5e1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
  }
  .gear-btn.on { outline: 5px solid #16a34a; }
  .gear-btn.locked { opacity: .55; }
  .gear-btn svg.icon { width: 72px; height: 72px; }
  .cost { display: flex; gap: 1px; }
  .cost svg { width: 12px; height: 12px; }
  .lockbit { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; }
  .lockbit svg { width: 22px; height: 22px; }
  .tools { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
  .tool {
    width: 72px; height: 72px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #cbd5e1;
    display: grid; place-items: center;
  }
  .tool.on { outline: 5px solid #0f172a; }
  .tool svg { width: 42px; height: 42px; }
  .pages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .pages button, .gallery button {
    flex: 0 0 auto; width: 74px; height: 74px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #cbd5e1;
    display: grid; place-items: center;
  }
  .pages svg, .gallery svg { width: 60px; height: 60px; }
  .pages button.on { outline: 4px solid #f97316; }
  #yay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,.35); z-index: 6;
  }
  #yay svg { width: 96px; height: 96px; }
  .no { animation: wobble .28s linear; }
  @keyframes wobble { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (orientation: landscape) and (min-width: 800px) {
    .home { display: grid; grid-template-columns: minmax(260px, 36%) 1fr; align-items: center; gap: 18px; min-height: calc(100vh - 24px); min-height: calc(100dvh - 24px); }
    .trace-main { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; }
    .trace-main .swatches { flex-direction: column; }
    #board { height: calc(100vh - 108px); height: calc(100dvh - 108px); }
  }
  @media (prefers-reduced-motion: reduce) { .no { animation: none; } }
</style>
</head>
<body>
<button class="mute" id="mute" data-act="mute" aria-label="Sound"></button>
<section class="screen on" id="s-home"></section>
<section class="screen" id="s-closet"></section>
<section class="screen" id="s-pick"></section>
<section class="screen" id="s-trace">
  <div class="top">
    <button class="back" data-act="pick" aria-label="All letters"></button>
    <div class="pips" id="pips"></div>
  </div>
  <div id="color-step"></div>
  <div id="trace-play" hidden>
    <div class="trace-main">
      <div class="swatches" id="swatches"></div>
      <svg id="board" viewBox="0 0 100 120"></svg>
    </div>
  </div>
</section>
<section class="screen" id="s-explore"></section>
<section class="screen" id="s-color"></section>
<div id="yay" hidden></div>

    }
    if (act === 'wear') {
      var g = Save.gearById(v);
      if (!g) return;
      if (!Save.unlocked(state.stars, g.id)) { sayKey('locked', 'Keep playing to earn stars.'); return; }
      state.avatar[g.slot] = state.avatar[g.slot] === g.id ? '' : g.id;
      save();
      renderCloset();
      return;
    }
    if (act === 'answer') {
      var q = Ex.QUESTIONS[qIndex];
      if (!Ex.correct(q.id, v)) {
        b.classList.remove('no');
        void b.offsetWidth;
        b.classList.add('no');
        sayKey('q-no', 'Try another picture.');
        return;
      }
      var earned = !state.explorer[q.id];
      state.explorer[q.id] = true;
      if (earned) state.stars += 1;
      save();
      sayKey(earned ? 'star' : 'q-yes', earned ? 'That\'s the one! You earned a star.' : 'That\'s the one!');
      var token = ++playToken;
      setTimeout(function () {
        if (token !== playToken) return;
        if (!$('s-explore').classList.contains('on')) return;
        qIndex = (qIndex + 1) % Ex.QUESTIONS.length;
        renderExplore();
      }, 900);
      return;
    }
    if (act === 'page') { colorId = v; fills = {}; ink = []; renderColor(); return; }
    if (act === 'brush') { brush = !brush; renderColor(); return; }
    if (act === 'eraser') { fills = {}; ink = []; renderColor(); return; }
    if (act === 'keep') {
      var next = [];
      for (var i = 0; i < state.gallery.length; i++) if (state.gallery[i].id !== colorId) next.push(state.gallery[i]);
      next.push({ id: colorId, fills: fills, ink: ink });
      state.gallery = next.slice(-6);
      save();
      renderColor();
      sayKey('saved', 'Saved.');
      return;
    }
    if (act === 'gallery') {
      var item = state.gallery[+v];
      if (!item) return;
      colorId = item.id;
      fills = {};
      for (var k in item.fills) if (Object.prototype.hasOwnProperty.call(item.fills, k)) fills[k] = item.fills[k];
      ink = [];
      for (var n = 0; n < item.ink.length; n++) ink.push({ color: item.ink[n].color, pts: item.ink[n].pts.slice() });
      renderColor();
    }
  }

  var board = $('board');
  board.addEventListener('pointerdown', function (e) {
    if (colorStep || busy || !$('s-trace').classList.contains('on')) return;
    e.preventDefault();
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    live = [toPt(e, board)];
    renderBoard();
  });
  board.addEventListener('pointermove', function (e) {
    if (!live) return;
    e.preventDefault();
    var p = toPt(e, board);
    var last = live[live.length - 1];
    if (Trace.dist(last, p) < 1.2) return;
    live.push(p);
    if (live.length > 500) live.shift();
    renderBoard();
  });
  function endLive() {
    if (!live) return;
    var pts = live;
    live = null;
    finishStroke(pts);
  }
  board.addEventListener('pointerup', endLive);
  board.addEventListener('pointercancel', endLive);

  document.addEventListener('pointerdown', prime, true);
  document.addEventListener('touchend', prime, { capture: true, passive: true });
  document.body.addEventListener('click', onClick);
  muteHtml();
  renderHome();
})();
</script>
</body>
</html>
