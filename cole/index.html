<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cole">
<title>Cole's Quest</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
  :root { --ink: #1e293b; --tap: 76px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(#7dd3fc, #fef9c3 55%, #bbf7d0);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; border: 0; background: none; color: inherit; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 4px solid #0f172a; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .screen { display: none; min-height: 100vh; min-height: 100dvh; padding: 12px; }
  .screen.on { display: block; }
  #s-color.on {
    display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
  }
  .color-main { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .back, .mute {
    width: 72px; height: 72px; border-radius: 50%; background: #fff;
    box-shadow: 0 6px 0 #94a3b8; display: grid; place-items: center; flex: 0 0 auto;
  }
  .back svg, .mute svg { width: 40px; height: 40px; }
  .mute { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 5; }
  .home { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .avatar-btn {
    background: rgba(255,255,255,.72); border-radius: 32px; padding: 8px 8px 12px;
    box-shadow: 0 8px 0 #38bdf8; display: flex; flex-direction: column; align-items: center;
  }
  .avatar { width: min(280px, 70vw); height: auto; }
  .stars { display: flex; gap: 4px; min-height: 28px; justify-content: center; }
  .stars svg { width: 28px; height: 28px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile {
    min-height: 148px; border-radius: 28px; background: #fff;
    box-shadow: 0 8px 0 #94a3b8; display: grid; place-items: center; padding: 10px;
  }
  .tile svg { width: 108px; height: 108px; }
  .tile.trace { box-shadow: 0 8px 0 #0284c7; }
  .tile.explore { box-shadow: 0 8px 0 #15803d; }
  .tile.color { box-shadow: 0 8px 0 #c2410c; }
  .tile.soon { background: #e2e8f0; box-shadow: 0 8px 0 #64748b; }
  .tile:active, .swatch:active, .choice:active, .gear-btn:active { transform: translateY(3px); }
  .pips { display: flex; gap: 8px; margin-left: auto; }
  .pip { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #64748b; }
  .pip.on { background: #f59e0b; box-shadow: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .swatch {
    width: 92px; height: 92px; border-radius: 50%; box-shadow: 0 6px 0 rgba(15,23,42,.25);
    border: 6px solid #fff;
  }
  .swatch.on { outline: 6px solid #0f172a; }
  .swatches.huge .swatch { width: 112px; height: 112px; }
  #color-step { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #preview svg { width: min(420px, 86vw); height: auto; }
  #board {
    width: 100%; height: min(68vh, 640px); height: min(68dvh, 640px);
    touch-action: none; background: transparent; display: block;
  }
  #paper {
    flex: 1 1 auto; min-height: 0; width: 100%; height: auto;
    touch-action: none; background: transparent; box-shadow: none;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #color-stage { position: relative; touch-action: none; }
  #color-stage canvas {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border-radius: 28px; touch-action: none;
  }
  #color-fill { background: #fff; box-shadow: 0 8px 0 #cbd5e1; }
  #color-ink, #color-lines { pointer-events: none; background: transparent; }
  .gallery img { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
  .paper { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
  .guide { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-dasharray: 1.8 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .guide.later { opacity: .28; }
  .guide.done { opacity: .15; }
  .fade .guide { opacity: .3; }
  .paint, .ink { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ink { stroke-width: 5.5; }
  .under { fill: none; stroke: rgba(15,23,42,.3); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .paint { stroke-width: 7.2; }
  .arrow { fill: #f97316; stroke: #9a3412; stroke-width: .8; }
  .startdot { fill: #f97316; stroke: #fff; stroke-width: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; padding-bottom: 24px; }
  .glyph {
    aspect-ratio: 1; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #cbd5e1;
    display: grid; place-items: center; position: relative;
  }
  .glyph.lower { background: #fef9c7; }
  .glyph.num { background: #e0f2fe; }
  .glyph svg { width: 78%; height: 78%; }
  .glyph.next { outline: 5px solid #f97316; }
  .badge { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .choices.three { grid-template-columns: 1fr 1fr 1fr; }
  .choice {
    min-height: 180px; border-radius: 28px; background: #fff; box-shadow: 0 8px 0 #94a3b8;
    display: grid; place-items: center; padding: 8px;
  }
  .choice svg { width: min(220px, 40vw); height: auto; }
  .snum { font-family: system-ui, sans-serif; font-size: 8px; font-weight: 800; fill: #475569; pointer-events: none; }
  .snum.on { font-size: 11px; fill: #ea580c; }
  .units { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .unit {
    min-height: 150px; border-radius: 24px; background: #fff; box-shadow: 0 8px 0 #94a3b8;
    display: grid; place-items: center; padding: 8px; position: relative;
  }
  .unit svg { width: min(150px, 32vw); height: auto; }
  .unit .badge { top: 8px; right: 8px; width: 28px; height: 28px; }
  .intro-art { display: grid; place-items: center; margin-top: 8px; }
  .intro-art svg { width: min(340px, 78vw); height: auto; }
  .go {
    width: 120px; height: 120px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 8px 0 #15803d; display: grid; place-items: center; margin: 16px auto;
  }
  .go svg { width: 64px; height: 64px; }
  .swatch.goal { box-shadow: 0 0 0 6px #fff, 0 0 0 12px #0f172a; }
  .modes { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
  .mode {
    width: 92px; height: 92px; border-radius: 22px; background: #fff; box-shadow: 0 5px 0 #cbd5e1;
    display: grid; place-items: center;
  }
  .mode.on { outline: 5px solid #f97316; }
  .mode svg { width: 70px; height: 70px; }
  .pages button.locked { opacity: .45; }
  .pattern { display: flex; gap: 10px; justify-content: center; margin: 8px 0 16px; }
  .pattern svg { width: 72px; height: 72px; background: #fff; border-radius: 16px; }
  .gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
  .gear-btn {
    min-height: 124px; border-radius: 22px; background: #fff; box-shadow: 0 6px 0 #cbd5e1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
  }
  .gear-btn.on { outline: 5px solid #16a34a; }
  .gear-btn.locked { opacity: .55; }
  .gear-btn svg.icon { width: 72px; height: 72px; }
  .cost { display: flex; gap: 1px; }
  .cost svg { width: 12px; height: 12px; }
  .lockbit { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; }
  .lockbit svg { width: 22px; height: 22px; }
  .tools { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
  .tool {
    width: 72px; height: 72px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #cbd5e1;
    display: grid; place-items: center;
  }
  .tool.on { outline: 5px solid #0f172a; }
  .tool svg { width: 42px; height: 42px; }
  .pages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .pages button, .gallery button {
    flex: 0 0 auto; width: 74px; height: 74px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #cbd5e1;
    display: grid; place-items: center;
  }
  .pages svg, .gallery svg, .pages canvas, .gallery canvas { width: 60px; height: 60px; display: block; }
  .pages button.on { outline: 4px solid #f97316; }
  #yay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,.35); z-index: 6;
  }
  #yay svg { width: 96px; height: 96px; }
  .no { animation: wobble .28s linear; }
  @keyframes wobble { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (orientation: landscape) and (min-width: 800px) {
    .home { display: grid; grid-template-columns: minmax(260px, 36%) 1fr; align-items: center; gap: 18px; min-height: calc(100vh - 24px); min-height: calc(100dvh - 24px); }
    .trace-main { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; }
    .trace-main .swatches { flex-direction: column; }
    .units { grid-template-columns: repeat(4, 1fr); }
    #board { height: calc(100vh - 108px); height: calc(100dvh - 108px); }
    #s-color .color-main { flex-direction: row; align-items: stretch; }
    #s-color .color-side { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
    #s-color .swatches { flex-direction: column; gap: 8px; }
    #s-color .swatch { width: 76px; height: 76px; }
    #s-color .tools { flex-direction: column; gap: 8px; margin: 0; }
    #s-color .tool { width: 64px; height: 64px; }
  }
  @media (prefers-reduced-motion: reduce) { .no { animation: none; } }
</style>
</head>
<body>
<button class="mute" id="mute" data-act="mute" aria-label="Sound"></button>
<section class="screen on" id="s-home"></section>
<section class="screen" id="s-closet"></section>
<section class="screen" id="s-pick"></section>
<section class="screen" id="s-trace">
  <div class="top">
    <button class="back" data-act="pick" aria-label="All letters"></button>
    <div class="pips" id="pips"></div>
  </div>
  <div id="color-step"></div>
  <div id="trace-play" hidden>
    <div class="trace-main">
      <div class="swatches" id="swatches"></div>
      <svg id="board" viewBox="0 0 100 120"></svg>
    </div>
  </div>
</section>
<section class="screen" id="s-explore"></section>
<section class="screen" id="s-color"></section>
<div id="yay" hidden></div>

<script>
/* COLE_SAVE_MODULE_START
   Cole's save. Own localStorage key, separate from Naomi's game. No DOM.
   Browser: window.ColeSave. Tests load this block. */
(function (root) {
  'use strict';
  var KEY = 'coleQuest.v1';
  var SCHEMA = 1;
  var SWATCH_IDS = ['red', 'orange', 'yellow', 'green', 'blue'];
  var PICTURES = ['excavator', 'truck', 'tree', 'sun', 'dog', 'rocket', 'hero'];
  var GEAR = [
    { id: 'hat', slot: 'head', cost: 2 },
    { id: 'boots', slot: 'feet', cost: 3 },
    { id: 'backpack', slot: 'back', cost: 4 },
    { id: 'hardhat', slot: 'head', cost: 5 },
    { id: 'vest', slot: 'body', cost: 6 },
    { id: 'excavator', slot: 'hand', cost: 8 },
    { id: 'cape', slot: 'back', cost: 6 },
    { id: 'mask', slot: 'face', cost: 5 },
    { id: 'sword', slot: 'hand', cost: 7 },
    { id: 'shield', slot: 'off', cost: 7 }
  ];
  var SLOTS = ['head', 'feet', 'back', 'body', 'face', 'hand', 'off'];

  function num(v, fallback, min, max) {
    var n = typeof v === 'number' ? v : (typeof v === 'string' && String(v).trim() !== '' ? Number(v) : NaN);
    if (!isFinite(n)) n = fallback;
    if (n < min) n = min;
    if (n > max) n = max;
    return n;
  }
  function gearById(id) {
    for (var i = 0; i < GEAR.length; i++) if (GEAR[i].id === id) return GEAR[i];
    return null;
  }
  function unlocked(stars, id) {
    var g = gearById(id);
    return !!(g && stars >= g.cost);
  }
  function toV1(raw) {
    raw.v = 1;
    if (typeof raw.stars !== 'number' || !isFinite(raw.stars)) raw.stars = 0;
    if (typeof raw.sound !== 'boolean') raw.sound = true;
    if (typeof raw.swatch !== 'string') raw.swatch = 'red';
    if (!raw.avatar || typeof raw.avatar !== 'object' || Array.isArray(raw.avatar)) raw.avatar = {};
    if (!raw.trace || typeof raw.trace !== 'object' || Array.isArray(raw.trace)) raw.trace = {};
    if (!raw.explorer || typeof raw.explorer !== 'object' || Array.isArray(raw.explorer)) raw.explorer = {};
    if (!Array.isArray(raw.gallery)) raw.gallery = [];
  }
  var MIGRATIONS = [toV1];
  function migrate(raw) {
    if (!raw || typeof raw !== 'object') return raw;
    var v = raw.v;
    if (typeof v !== 'number' || !isFinite(v) || v < 0) v = 0;
    v = Math.floor(v);
    var guard = 0;
    while (v < SCHEMA && guard < 8) {
      var step = MIGRATIONS[v];
      if (typeof step === 'function') step(raw);
      if (typeof raw.v !== 'number' || !(raw.v > v)) raw.v = v + 1;
      v = Math.floor(raw.v);
      guard++;
    }
    if (!(v >= 1 && v <= SCHEMA)) raw.v = SCHEMA;
    else raw.v = v;
    return raw;
  }
  function defaults() {
    return {
      v: SCHEMA, stars: 0, sound: true, swatch: 'red',
      avatar: { head: '', feet: '', back: '', body: '', face: '', hand: '', off: '' },
      trace: {}, explorer: {}, gallery: []
    };
  }
  function glyphIdOk(id) {
    return id === '10' || /^[A-Za-z0-9]$/.test(id);
  }
  function sanitizeTrace(src) {
    var out = {};
    if (!src || typeof src !== 'object' || Array.isArray(src)) return out;
    var n = 0;
    for (var id in src) {
      if (!Object.prototype.hasOwnProperty.call(src, id)) continue;
      if (n >= 80 || !glyphIdOk(id)) continue;
      var c = src[id];
      if (!c || typeof c !== 'object' || Array.isArray(c)) continue;
      out[id] = {
        stage: Math.round(num(c.stage, 0, 0, 3)),
        wins: Math.round(num(c.wins, 0, 0, 99)),
        mastered: c.mastered === true
      };
      n++;
    }
    return out;
  }
  function sanitizeAvatar(src, stars) {
    var out = { head: '', feet: '', back: '', body: '', face: '', hand: '', off: '' };
    var a = (src && typeof src === 'object' && !Array.isArray(src)) ? src : {};
    for (var i = 0; i < SLOTS.length; i++) {
      var slot = SLOTS[i];
      var id = typeof a[slot] === 'string' ? a[slot] : '';
      var g = gearById(id);
      out[slot] = (g && g.slot === slot && stars >= g.cost) ? id : '';
    }
    return out;
  }
  function sanitizeExplorer(src) {
    var out = {};
    if (!src || typeof src !== 'object' || Array.isArray(src)) return out;
    var n = 0;
    for (var id in src) {
      if (!Object.prototype.hasOwnProperty.call(src, id)) continue;
      if (n >= 120 || !/^[a-z0-9-]{1,24}$/.test(id)) continue;
      if (src[id] === true) { out[id] = true; n++; }
    }
    return out;
  }
  function sanitizeInk(ink) {
    var out = [];
    if (!Array.isArray(ink)) return out;
    for (var i = 0; i < ink.length && out.length < 8; i++) {
      var s = ink[i];
      if (!s || SWATCH_IDS.indexOf(s.color) < 0 || !Array.isArray(s.pts)) continue;
      var pts = [];
      for (var j = 0; j < s.pts.length && pts.length < 24; j++) {
        var p = s.pts[j];
        if (!p || p.length < 2) continue;
        pts.push([Math.round(num(p[0], 0, 0, 100)), Math.round(num(p[1], 0, 0, 100))]);
      }
      if (pts.length >= 2) out.push({ color: s.color, pts: pts });
    }
    return out;
  }
  function sanitizeGallery(list) {
    var out = [];
    if (!Array.isArray(list)) return out;
    for (var i = 0; i < list.length && out.length < 6; i++) {
      var item = list[i];
      if (!item || PICTURES.indexOf(item.id) < 0) continue;
      var fills = {};
      var src = (item.fills && typeof item.fills === 'object' && !Array.isArray(item.fills)) ? item.fills : {};
      var n = 0;
      for (var k in src) {
        if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
        if (n >= 12 || !/^[a-z]{1,12}$/.test(k)) continue;
        if (SWATCH_IDS.indexOf(src[k]) < 0) continue;
        fills[k] = src[k];
        n++;
      }
      var shot = '';
      if (typeof item.shot === 'string' && item.shot.indexOf('data:image/jpeg;base64,') === 0 && item.shot.length <= 120000 && item.shot.indexOf('<') < 0) shot = item.shot;
      out.push({ id: item.id, fills: fills, ink: sanitizeInk(item.ink), shot: shot });
    }
    return out;
  }
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, save: defaults() };
    migrate(raw);
    var stars = Math.round(num(raw.stars, 0, 0, 999));
    var swatch = SWATCH_IDS.indexOf(raw.swatch) >= 0 ? raw.swatch : 'red';
    return {
      ok: true,
      save: {
        v: SCHEMA,
        stars: stars,
        sound: raw.sound !== false,
        swatch: swatch,
        avatar: sanitizeAvatar(raw.avatar, stars),
        trace: sanitizeTrace(raw.trace),
        explorer: sanitizeExplorer(raw.explorer),
        gallery: sanitizeGallery(raw.gallery)
      }
    };
  }
  function load() {
    var raw = null;
    try { raw = JSON.parse(root.localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    if (!raw) return defaults();
    var out = sanitize(raw);
    return out.ok ? out.save : defaults();
  }
  function persist(state) {
    var clean = sanitize(state).save;
    root.localStorage.setItem(KEY, JSON.stringify(clean));
    return clean;
  }
  var api = {
    KEY: KEY, SCHEMA: SCHEMA, SWATCH_IDS: SWATCH_IDS, PICTURES: PICTURES, GEAR: GEAR, SLOTS: SLOTS,
    MIGRATIONS: MIGRATIONS, gearById: gearById, unlocked: unlocked, migrate: migrate, defaults: defaults,
    sanitize: sanitize, load: load, persist: persist
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ColeSave = api;
})(typeof window !== 'undefined' ? window : this);
/* COLE_SAVE_MODULE_END */
</script>
<script>
/* COLE_TRACE_MODULE_START
   Letter and number strokes, swatches, and tracing scores. No DOM.
   Browser: window.ColeTrace. Tests load this block.
   Shared letter names: ../audio/letters/<a-z>.m4a
   Cole prompts and numbers: audio/n0.m4a through audio/n10.m4a
   Stroke order is Handwriting Without Tears: capitals start at the top,
   big lines first, frog-jump starts. STROKE_TABLES is the one place a
   later Zaner-Bloser or D'Nealian table can be swapped in. */
(function (root) {
  'use strict';
  var SWATCHES = [
    { id: 'red', hex: '#ef4444' },
    { id: 'orange', hex: '#f97316' },
    { id: 'yellow', hex: '#facc15' },
    { id: 'green', hex: '#22c55e' },
    { id: 'blue', hex: '#3b82f6' }
  ];
  var STAGE_NAMES = ['guide', 'fade', 'dot', 'free'];
  var NUMBER_WORDS = { '0': 'zero', '1': 'one', '2': 'two', '3': 'three', '4': 'four', '5': 'five', '6': 'six', '7': 'seven', '8': 'eight', '9': 'nine', '10': 'ten' };
  var TAILS = [
    'Trace on the dots. Start at the dot and follow the arrow.',
    'The dots are light. Trace it.',
    'Start at the dot and write it.',
    'Write it in the box.'
  ];

  function dist(a, b) {
    var dx = a[0] - b[0], dy = a[1] - b[1];
    return Math.sqrt(dx * dx + dy * dy);
  }
  function line(x1, y1, x2, y2, n) {
    n = n || 5;
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      pts.push([Math.round(x1 + (x2 - x1) * t), Math.round(y1 + (y2 - y1) * t)]);
    }
    return pts;
  }
  function oval(cx, cy, rx, ry) {
    var pts = [], n = 18;
    for (var i = 0; i <= n; i++) {
      var a = -Math.PI / 2 + (Math.PI * 2) * (i / n);
      pts.push([Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry)]);
    }
    return pts;
  }
  function catmull(p0, p1, p2, p3, t) {

      }
    }
    return null;
  }
  function floodFill(entry, x, y, rgb) {
    var mask = entry.mask;
    var spot = nearOpen(mask, x, y);
    if (!spot) return null;
    x = spot[0];
    y = spot[1];
    var ctx = entry.fill.getContext('2d', { willReadFrequently: true });
    var img = ctx.getImageData(0, 0, COLOR_SIZE, COLOR_SIZE);
    var d = img.data;
    var start = (y * COLOR_SIZE + x) * 4;
    if (d[start] === rgb[0] && d[start + 1] === rgb[1] && d[start + 2] === rgb[2]) return { hit: [] };
    var before = new Uint8ClampedArray(d);
    var seen = new Uint8Array(COLOR_SIZE * COLOR_SIZE);
    var stack = [x, y];
    var count = 0;
    var cap = Math.floor(COLOR_SIZE * COLOR_SIZE * 0.42);
    seen[y * COLOR_SIZE + x] = 1;
    while (stack.length) {
      var py = stack.pop();
      var px = stack.pop();
      var p = (py * COLOR_SIZE + px) * 4;
      d[p] = rgb[0];
      d[p + 1] = rgb[1];
      d[p + 2] = rgb[2];
      d[p + 3] = 255;
      count++;
      if (count > cap) {
        img.data.set(before);
        return null;
      }
      if (px > 0) push(px - 1, py);
      if (px + 1 < COLOR_SIZE) push(px + 1, py);
      if (py > 0) push(px, py - 1);
      if (py + 1 < COLOR_SIZE) push(px, py + 1);
    }
    function push(nx, ny) {
      var ni = ny * COLOR_SIZE + nx;
      if (seen[ni] || mask[ni]) return;
      seen[ni] = 1;
      stack.push(nx, ny);
    }
    ctx.putImageData(img, 0, 0);
    var hit = [];
    var seeds = entry.seeds || [];
    for (var s = 0; s < seeds.length; s++) {
      var sx = Math.round(seeds[s].x * (COLOR_SIZE - 1));
      var sy = Math.round(seeds[s].y * (COLOR_SIZE - 1));
      if (seen[sy * COLOR_SIZE + sx]) hit.push(seeds[s]);
    }
    return { hit: hit, before: before, img: img, ctx: ctx };
  }
  function restoreFill(result) {
    if (!result || !result.before) return;
    result.img.data.set(result.before);
    result.ctx.putImageData(result.img, 0, 0);
  }
  function seedsMatch(entry) {
    var seeds = entry.seeds || [];
    if (!seeds.length) return false;
    var d = entry.fill.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, COLOR_SIZE, COLOR_SIZE).data;
    for (var i = 0; i < seeds.length; i++) {
      var rgb = rgbOf(seeds[i].color);
      var sx = Math.round(seeds[i].x * (COLOR_SIZE - 1));
      var sy = Math.round(seeds[i].y * (COLOR_SIZE - 1));
      var p = (sy * COLOR_SIZE + sx) * 4;
      if (Math.abs(d[p] - rgb[0]) > 16 || Math.abs(d[p + 1] - rgb[1]) > 16 || Math.abs(d[p + 2] - rgb[2]) > 16) return false;
    }
    return true;
  }
  function rgbOf(swatchId) {
    var h = hex(swatchId);
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function renderColor() {
    var gen = ++colorGen;
    var goal = '';
    var sid = sheetIdFor(colorMode, colorId);
    var pageKey = colorMode + ':' + sid;
    var fresh = pageKey !== paintKey;
    paintKey = pageKey;
    if (colorMode === 'name') goal = Color.goalColor(Color.namedById(colorId));
    var modes = '<div class="modes">';
    modes += '<button class="mode' + (colorMode === 'name' ? ' on' : '') + '" data-act="cmode" data-v="name" aria-label="Colors">' + modeIcon('name') + '</button>';
    modes += '<button class="mode' + (colorMode === 'letter' ? ' on' : '') + '" data-act="cmode" data-v="letter" aria-label="Letter pictures">' + modeIcon('letter') + '</button>';
    modes += '<button class="mode' + (colorMode === 'free' ? ' on' : '') + '" data-act="cmode" data-v="free" aria-label="Free coloring">' + modeIcon('free') + '</button>';
    modes += '</div>';
    var pages = '';
    function thumbBtn(id, label, on, locked, art) {
      var body = locked ? lockSvg() : '<canvas data-kind="' + (on ? 'page' : 'empty') + '" data-sheet="' + art + '" width="64" height="64"></canvas>';
      return '<button data-act="page" data-v="' + id + '" class="' + (on ? 'on' : '') + (locked ? ' locked' : '') + '" aria-label="' + label + '">' + body + '</button>';
    }
    if (colorMode === 'name') {
      for (var i = 0; i < Color.NAMED.length; i++) {
        var n = Color.NAMED[i];
        pages += thumbBtn(n.id, n.id, n.id === colorId, false, n.id);
      }
    } else if (colorMode === 'letter') {
      for (var li = 0; li < Color.LETTERS.length; li++) {
        var letter = Color.LETTERS[li];
        pages += thumbBtn(letter.id, letter.word, letter.id === colorId, !letterReady(letter.id), Color.artId(letter.id));
      }
    } else {
      for (var fi = 0; fi < Save.PICTURES.length; fi++) {
        var fid = Save.PICTURES[fi];
        pages += thumbBtn(fid, fid, fid === colorId, false, fid);
      }
    }
    var tools = '<div class="tools">';
    tools += '<button class="tool' + (brush ? ' on' : '') + '" data-act="brush" aria-label="Brush"><svg viewBox="0 0 40 40"><rect x="18" y="6" width="8" height="20" rx="2" fill="#7c3aed"/><path d="M16 26 h12 l-2 8 h-8 z" fill="#f59e0b"/></svg></button>';
    tools += '<button class="tool" data-act="eraser" aria-label="Clear"><svg viewBox="0 0 40 40"><rect x="8" y="16" width="24" height="12" rx="2" fill="#fca5a5" transform="rotate(-20 20 22)"/></svg></button>';
    if (colorMode === 'free') tools += '<button class="tool" data-act="keep" aria-label="Save"><svg viewBox="0 0 40 40"><path d="M8 8 H26 L32 14 V32 H8 Z" fill="#fff" stroke="#0f172a" stroke-width="2"/><rect x="14" y="20" width="12" height="8" fill="#38bdf8"/></svg></button>';
    tools += '</div>';
    var gals = '';
    if (colorMode === 'free') {
      gals = '<div class="gallery">';
      for (var g = 0; g < state.gallery.length; g++) {
        var item = state.gallery[g];
        if (item.shot) gals += '<button data-act="gallery" data-v="' + g + '" aria-label="Saved picture"><img alt="" src="' + item.shot + '"></button>';
        else gals += '<button data-act="gallery" data-v="' + g + '" aria-label="Saved picture"><canvas data-kind="empty" data-sheet="' + item.id + '" width="64" height="64"></canvas></button>';
      }
      gals += '</div>';
    }
    $('s-color').innerHTML = '<div class="top">' + backBtn('home', 'Home') + '</div>' + modes + '<div class="pages">' + pages + '</div>' +
      '<div class="color-main"><div class="color-side">' + swatchButtons(false, goal) + tools + '</div>' +
      '<div id="paper"><div id="color-stage"><canvas id="color-fill"></canvas><canvas id="color-ink"></canvas><canvas id="color-lines"></canvas></div></div></div>' + gals;
    var shotNow = pendingShot;
    pendingShot = '';
    var nodes = $('s-color').querySelectorAll('canvas[data-sheet]');
    for (var ci = 0; ci < nodes.length; ci++) {
      (function (node) {
        loadSheet(node.getAttribute('data-sheet'), function (entry) {
          if (gen !== colorGen || !node.isConnected || !entry) return;
          if (node.id === 'color-fill' || node.getAttribute('data-kind') === 'page' && node.parentNode && node.parentNode.getAttribute('data-act') === 'page' && node.parentNode.classList.contains('on')) {
            /* thumb of the open page */
          }
          if (node.getAttribute('data-kind') === 'page') paintThumb(node, entry, true);
          else paintThumb(node, entry, false);
        });
      })(nodes[ci]);
    }
    loadSheet(sid, function (entry) {
      if (gen !== colorGen || !entry || !$('color-fill')) return;
      if (fresh) {
        clearPaint(entry);
        if (shotNow) {
          var photo = new Image();
          photo.onload = function () {
            if (gen !== colorGen) return;
            var f = entry.fill.getContext('2d');
            f.fillStyle = '#ffffff';
            f.fillRect(0, 0, COLOR_SIZE, COLOR_SIZE);
            f.drawImage(photo, 0, 0, COLOR_SIZE, COLOR_SIZE);
            redrawInk(entry, ink);
            blitMain(entry);
            var thumbs = $('s-color').querySelectorAll('canvas[data-kind="page"]');
            for (var t = 0; t < thumbs.length; t++) paintThumb(thumbs[t], entry, true);
          };
          photo.src = shotNow;
        }
        redrawInk(entry, ink);
      }
      blitMain(entry);
      fitPaper();
      var thumbs2 = $('s-color').querySelectorAll('canvas[data-kind="page"]');
      for (var t2 = 0; t2 < thumbs2.length; t2++) paintThumb(thumbs2[t2], entry, true);
    });
    if (colorSpeak) {
      colorSpeak = false;
      if (colorMode === 'name') {
        var page = Color.namedById(colorId);
        sayKey(page.clip.replace(/^audio\//, '').replace(/\.m4a$/, ''), page.say);
      } else if (colorMode === 'letter') {
        if (!letterReady(colorId)) sayKey('first-' + colorId.toLowerCase(), Color.traceFirst(colorId));
        else {
          var info = Color.letterById(colorId);
          sayKey('let-' + colorId.toLowerCase(), info.say);
        }
      } else sayKey('color', 'Tap a color, then tap the picture.');
    }
    var paper = $('paper');
    var stage = $('color-stage');
    var liveLine = null;
    paper.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      if (colorMode === 'letter' && !letterReady(colorId)) {
        sayKey('first-' + colorId.toLowerCase(), Color.traceFirst(colorId));
        return;
      }
      var entry = sheetCache[sid];
      if (!entry || !entry.ready) return;
      if (!brush) {
        var pt = paperPoint(e, stage);
        var px = Math.round(pt[0] / 100 * (COLOR_SIZE - 1));
        var py = Math.round(pt[1] / 100 * (COLOR_SIZE - 1));
        var rgb = rgbOf(state.swatch);
        var result = floodFill(entry, px, py, rgb);
        if (!result) return;
        if (colorMode === 'name' && result.hit) {
          var bad = '';
          for (var h = 0; h < result.hit.length; h++) if (result.hit[h].color !== state.swatch) bad = result.hit[h].color;
          if (bad) {
            restoreFill(result);
            blitMain(entry);
            var line = Color.wrongLine(state.swatch, bad);
            sayKey(line.clip.replace(/^audio\//, '').replace(/\.m4a$/, ''), line.text);
            paper.classList.remove('no');
            void paper.offsetWidth;
            paper.classList.add('no');
            return;
          }
        }
        blitMain(entry);
        if (colorMode === 'name') {
          var donePage = Color.namedById(colorId);
          var key = 'color-' + donePage.id;
          if (seedsMatch(entry) && !state.explorer[key]) {
            state.explorer[key] = true;
            state.stars += 1;
            save();
            colorSpeak = false;
            renderColor();
            $('yay').hidden = false;
            $('yay').innerHTML = starSvg('#f59e0b') + starSvg('#facc15') + starSvg('#fb7185');
            sayKey('star', 'You did it! You earned a star.');
            var token = ++playToken;
            setTimeout(function () { if (token === playToken) $('yay').hidden = true; }, 1100);
            return;
          }
        }
        colorSpeak = false;
        renderColor();
        return;
      }
      e.preventDefault();
      try { paper.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      liveLine = [paperPoint(e, stage)];
    });
    paper.addEventListener('pointermove', function (e) {
      if (!liveLine) return;
      e.preventDefault();
      var pt = paperPoint(e, stage);
      var last = liveLine[liveLine.length - 1];
      if (Trace.dist(last, pt) < 1.2) return;
      liveLine.push(pt);
      var inkView = $('color-ink');
      var entry = sheetCache[sid];
      if (!inkView || !entry) return;
      var ctx = inkView.getContext('2d');
      ctx.clearRect(0, 0, COLOR_SIZE, COLOR_SIZE);
      ctx.drawImage(entry.ink, 0, 0);
      drawStrokes(ctx, [{ color: state.swatch, pts: liveLine }]);
    });
    paper.addEventListener('pointerup', function () {
      if (!liveLine) return;
      if (liveLine.length > 1 && ink.length < 8) ink.push({ color: state.swatch, pts: liveLine.slice(0, 24) });
      liveLine = null;
      var entry = sheetCache[sid];
      if (entry) redrawInk(entry, ink);
      colorSpeak = false;
      renderColor();
    });
    paper.addEventListener('pointercancel', function () {
      if (!liveLine) return;
      liveLine = null;
      renderColor();
    });
  }
  function onClick(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.id === 'mute' && e.target.closest('#paper')) return;
    var act = b.getAttribute('data-act');
    var v = b.getAttribute('data-v');
    if (act === 'mute') {
      state.sound = !state.sound;
      save();
      muteHtml();
      return;
    }
    if (act === 'home') { playToken++; busy = false; show('s-home'); return; }
    if (act === 'closet') { show('s-closet'); return; }
    if (act === 'pick') { playToken++; busy = false; show('s-pick'); return; }
    if (act === 'explore') { exploreMode = 'pick'; show('s-explore'); return; }
    if (act === 'units') { exploreMode = 'pick'; renderExplore(); return; }
    if (act === 'unit') { unitId = v; qIndex = 0; exploreMode = 'intro'; renderExplore(); return; }
    if (act === 'unit-go') { exploreMode = 'ask'; qIndex = 0; renderExplore(); return; }
    if (act === 'color') {
      colorMode = 'name';
      colorId = 'truck';
      fills = {}; ink = []; brush = false;
      colorSpeak = true;
      show('s-color');
      return;
    }
    if (act === 'cmode') {
      colorMode = v;
      fills = {}; ink = []; brush = false;
      if (v === 'name') colorId = 'truck';
      else if (v === 'letter') colorId = 'A';
      else colorId = 'excavator';
      colorSpeak = true;
      renderColor();
      return;
    }
    if (act === 'soon') { sayKey('soon', 'Red words are coming soon.'); return; }
    if (act === 'glyph') { openGlyph(v); return; }
    if (act === 'swatch') {
      state.swatch = Trace.selectSwatch(v).id;
      save();
      if (colorStep && $('s-trace').classList.contains('on')) startBoard();
      else if ($('s-color').classList.contains('on')) renderColor();
      else renderTrace();
      return;
    }
    if (act === 'wear') {
      var g = Save.gearById(v);
      if (!g) return;
      if (!Save.unlocked(state.stars, g.id)) { sayKey('locked', 'Keep playing to earn stars.'); return; }
      state.avatar[g.slot] = state.avatar[g.slot] === g.id ? '' : g.id;
      save();
      renderCloset();
      return;
    }
    if (act === 'answer') {
      var unit = Ex.unitById(unitId);
      var q = unit.questions[qIndex];
      if (!Ex.correct(q.id, v)) {
        b.classList.remove('no');
        void b.offsetWidth;
        b.classList.add('no');
        sayKey('q-no', "Let's look again.");
        return;
      }
      sayKey('why-' + q.id, q.why);
      var last = qIndex + 1 >= unit.questions.length;
      var token = ++playToken;
      setTimeout(function () {
        if (token !== playToken) return;
        if (!$('s-explore').classList.contains('on')) return;
        if (!last) { qIndex++; renderExplore(); return; }
        var key = 'unit-' + unit.id;
        var earned = !state.explorer[key];
        if (earned) { state.explorer[key] = true; state.stars += 1; save(); }
        if (earned) {
          $('yay').hidden = false;
          $('yay').innerHTML = starSvg('#f59e0b') + starSvg('#facc15') + starSvg('#fb7185');
          sayKey('star', 'You did it! You earned a star.');
        }
        setTimeout(function () {
          if (token !== playToken) return;
          $('yay').hidden = true;
          exploreMode = 'pick';
          renderExplore();
        }, earned ? 1200 : 400);
      }, 1700);
      return;
    }
    if (act === 'page') {
      if (colorMode === 'letter' && !letterReady(v)) {
        sayKey('first-' + v.toLowerCase(), Color.traceFirst(v));
        return;
      }
      colorId = v; fills = {}; ink = []; colorSpeak = true; renderColor(); return;
    }
    if (act === 'brush') { brush = !brush; renderColor(); return; }
    if (act === 'eraser') {
      fills = {}; ink = [];
      clearPaint(sheetCache[sheetIdFor(colorMode, colorId)]);
      renderColor();
      return;
    }
    if (act === 'keep') {
      var next = [];
      for (var i = 0; i < state.gallery.length; i++) if (state.gallery[i].id !== colorId) next.push(state.gallery[i]);
      var kept = sheetCache[sheetIdFor(colorMode, colorId)];
      next.push({ id: colorId, fills: fills, ink: ink, shot: galleryShot(kept) });
      state.gallery = next.slice(-6);
      save();
      renderColor();
      sayKey('saved', 'Saved.');
      return;
    }
    if (act === 'gallery') {
      var item = state.gallery[+v];
      if (!item) return;
      colorMode = 'free';
      colorSpeak = false;
      colorId = item.id;
      fills = {};
      for (var k in item.fills) if (Object.prototype.hasOwnProperty.call(item.fills, k)) fills[k] = item.fills[k];
      ink = [];
      for (var n = 0; n < item.ink.length; n++) ink.push({ color: item.ink[n].color, pts: item.ink[n].pts.slice() });
      pendingShot = item.shot || '';
      paintKey = '';
      renderColor();
    }
  }

  var board = $('board');
  board.addEventListener('pointerdown', function (e) {
    if (colorStep || busy || !$('s-trace').classList.contains('on')) return;
    e.preventDefault();
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    live = [toPt(e, board)];
    renderBoard();
  });
  board.addEventListener('pointermove', function (e) {
    if (!live) return;
    e.preventDefault();
    var p = toPt(e, board);
    var last = live[live.length - 1];
    if (Trace.dist(last, p) < 1.2) return;
    live.push(p);
    if (live.length > 500) live.shift();
    renderBoard();
  });
  function endLive() {
    if (!live) return;
    var pts = live;
    live = null;
    finishStroke(pts);
  }
  board.addEventListener('pointerup', endLive);
  board.addEventListener('pointercancel', endLive);

  window.addEventListener('resize', function () {
    if ($('s-color').classList.contains('on')) fitPaper();
  });
  document.addEventListener('pointerdown', prime, true);
  document.addEventListener('touchend', prime, { capture: true, passive: true });
  document.body.addEventListener('click', onClick);
  muteHtml();
  renderHome();
})();
</script>
</body>
</html>
